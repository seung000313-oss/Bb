// CSV 한 장 → 선수 행 목록 (구단/팀 열이 있으면 여러 구단을 모두 읽음)
function parseCSV(text){
  const rows=text.replace(/^\uFEFF/,'').replace(/\r/g,'').split('\n').filter(l=>l.trim()).map(splitLine);
  if(rows.length<2)throw new Error('데이터가 없어요');

  const col=(keys,exact)=>{for(const k of keys){const i=hd.findIndex(h=>h===norm(k));if(i>=0)return i}if(exact)return -1;return hd.findIndex(h=>keys.some(k=>h.includes(norm(k))))};

    reg:col(['등록포지션','포지션','pos','position','수비'],true),rec:col(['기록포지션'],true),hand:col(['투타','손','hand','좌우']),
    games:col(['시즌경기','경기','games','g'],false),avg:col(['타율','avg'],true),hr:col(['홈런','hr'],true),era:col(['평균자책점','era','방어율'],true),
    contact:col(['컨택','contact','정확']),power:col(['파워','power','장타']),velo:col(['구속','velo','speed']),control:col(['제구','control'],true),stuff:col(['구위','stuff'],true),stamina:col(['체력','stamina','스태미나'],true),arm:col(['투구폼','폼','arm','armslot'],true),note:col(['비고','note'],true)};
  if(C.name<0)throw new Error('"선수/이름" 열을 찾지 못했어요');
  const pctC=C.contact>=0&&/%/.test(raw[C.contact]),pctP=C.power>=0&&/%/.test(raw[C.power]),veloAvg=C.velo>=0&&/평균|avg/i.test(raw[C.velo]);
  const out=[];
  rows.slice(1).forEach((r,ri)=>{const v=k=>C[k]>=0?(r[C[k]]||'').trim():'';const name=v('name');if(!name)return;
    const reg=v('reg'),rec=v('rec'),posTxt=C.rec>=0?rec:reg,kind=v('kind');
    const isP=/투수|^p$|pitch/i.test(kind)||isPitchPos(reg)||isPitchPos(rec);
    const num=k=>{const x=parseFloat(v(k));return isNaN(x)?null:x};
    const row={team:C.team>=0?(v('team')||'_'):'_',name,isP,order:ri,games:num('games')||0,regPos:reg,hand:handOf(v('hand'),isP)};
    if(isP){const roleTxt=rec||reg;row.role=/선발|^SP$/i.test(roleTxt)?'SP':/구원|불펜|중계|마무리|셋업|^RP$|^CP$/i.test(roleTxt)?'RP':'';row.cl=/마무리|^CP$/i.test(roleTxt);

      row.velo=ars.length?Math.max(...ars.map(a=>a.v)):(num('velo')||145);row.veloAvg=veloAvg;
      const at=v('arm');row.arm=/언더|under|sub/i.test(at)?'under':/사이드|side/i.test(at)?'side':'over';row.note=v('note');
      const e=row.era;row.stuff=num('stuff')??(e!=null?clamp(Math.round(92-(e-1.5)*5),45,95):62);
      row.control=num('control')??(e!=null?clamp(Math.round(88-(e-1.5)*4.5),45,92):62);
      row.stamina=num('stamina')??(row.role==='SP'?85:row.role==='RP'?45:50);row.hand=row.hand||'R'}
    else{row.pos=posCode(posTxt);row.avg=num('avg');row.hr=num('hr');
      const c=num('contact'),pw=num('power');

      row.power=pw==null?50:pctP?clamp(Math.round(50+(pw-98)*1.05),15,99):pw}
    out.push(row)});
  return{rows:out,hasTeam:C.team>=0,hasGames:C.games>=0}}

function findClub(v){const n=norm(v);if(!n)return null;const cs=clubs();
  const ym=String(v).trim().match(/^'?(\d{2})(?!\d)\s*(.+)$/);if(ym){const y=(+ym[1]>=82?'19':'20')+ym[1];const c2=cs.find(c=>norm(c)===norm(y+ym[2]));if(c2)return c2}
  const ym2=String(v).trim().match(/^(.+?)\s*'?(\d{2}|\d{4})$/);if(ym2){const yy=ym2[2].length===2?((+ym2[2]>=82?'19':'20')+ym2[2]):ym2[2];const c3=cs.find(c=>norm(c)===norm(yy+ym2[1]));if(c3)return c3}
  return cs.find(c=>norm(c)===n)||(CLUB_ALIAS[n]&&cs.includes(CLUB_ALIAS[n])?CLUB_ALIAS[n]:null)||cs.find(c=>norm(c).length>=2&&n.startsWith(norm(c)))||null}
function battingOrder(nine){const byPow=[...nine].sort((a,b)=>b.power-a.power||b.contact-a.contact),mid=byPow.slice(0,3);
  const rest=nine.filter(x=>!mid.includes(x)).sort((a,b)=>b.contact-a.contact||b.power-a.power);
  return[rest[0],rest[1],mid[1],mid[0],mid[2],rest[2],rest[3],rest[4],rest[5]].filter(Boolean)}
// 선수 행 → 라인업/벤치/투수진 자동 구성
function rosterFromRows(rows,hasGames){
  const H=rows.filter(r=>!r.isP),Pi=rows.filter(r=>r.isP),used=new Set(),slot={};
  const rank=(a,b)=>hasGames?(b.games-a.games||b.contact+b.power-a.contact-a.power):a.order-b.order;
  const ORDER=['C','SS','2B','CF','3B','1B','LF','RF','DH'];
  const CLS={C:/포수/,'1B':/1루|내야/,'2B':/2루|내야/,'3B':/3루|내야/,SS:/유격|내야/,LF:/좌익|외야/,CF:/중견|외야/,RF:/우익|외야/,DH:/./};
  for(const pos of ORDER){const c=H.filter(r=>!used.has(r)&&r.pos===pos).sort(rank)[0];if(c){slot[pos]=c;used.add(c)}}
  for(const pos of ORDER){if(slot[pos])continue;const pool=H.filter(r=>!used.has(r));
    const c=pool.filter(r=>CLS[pos].test(r.regPos)).sort(rank)[0]||pool.sort(rank)[0];if(c){slot[pos]=c;used.add(c)}}
  const hd=(r,pos)=>({name:r.name,pos,hand:r.hand||'',contact:r.contact,power:r.power,avg:r.avg,hr:r.hr,games:r.games,nat:natOf(r.name,r.pos||(pos!=='DH'&&!r.pos?'':''),r.regPos)});
  let nine=ORDER.filter(p=>slot[p]).map(p=>hd(slot[p],p));
  nine.forEach(h=>{if(h.pos!=='DH'&&h.nat.length&&!h.nat.includes(h.pos))h.nat.push(h.pos)});   // 기본 라인업 배치는 본 포지션으로 인정
  const base=genRoster(500+rows.length);let bi=0;
  while(nine.length<9){const miss=ORDER.find(p=>!nine.some(x=>x.pos===p))||'DH';nine.push(Object.assign({},base.lineup[bi++],{pos:miss}))}
  if(hasGames)nine=battingOrder(nine);
  else nine.sort((a,b)=>{const ia=H.findIndex(r=>r.name===a.name),ib=H.findIndex(r=>r.name===b.name);return(ia<0?999:ia)-(ib<0?999:ib)});
  const bench=H.filter(r=>!used.has(r)).sort(rank).map(r=>{const h=hd(r,r.pos||'');if(!h.pos)h.pos=(h.nat.find(x=>FIELD_POS.includes(x))||'');return h});
  const pd=r=>({name:r.name,hand:r.hand||'R',arm:r.arm||'over',veloAvg:!!r.veloAvg,velo:r.velo,control:r.control,stuff:r.stuff,stamina:r.stamina,arsenal:r.arsenal,era:r.era,role:r.role,cl:!!r.cl,games:r.games});
  let SPs=Pi.filter(r=>r.role==='SP');
  let sp;if(hasGames){const pool=SPs.filter(r=>r.games>=10);sp=pick(pool.length?pool:SPs.length?SPs:Pi)}else sp=SPs[0]||Pi[0];
  const pen=Pi.filter(r=>r!==sp).sort((a,b)=>{const ra=a.role==='RP'?0:a.role==='SP'?1:2,rb=b.role==='RP'?0:b.role==='SP'?1:2;return ra-rb||((a.era??99)-(b.era??99))});
  let pitchers=sp?[pd(sp),...pen.map(pd)]:[];
  if(pitchers.length<4)pitchers=pitchers.concat(base.pitchers.slice(pitchers.length?1:0,5-pitchers.length));
  return{lineup:nine,bench:bench.length?bench:base.bench,pitchers}}
function rosterFromClub(c){return rosterFromRows(DB.filter(r=>r.team===c),true)}

  for(let a=-45,i=0;a<45;a+=7.5,i++){if(i%2)continue;poly([[0,0,0],...[0,1,2,3].map(j=>P(fence(a+j*2.5),a+j*2.5))],'rgba(255,255,255,.06)')}

  const hc=[];for(let a=0;a<360;a+=20)hc.push([4.6*Math.sin(a*D2R),0,4.6*Math.cos(a*D2R)]);poly(hc,'#c58b57');
  poly([[0,0,3.6],[15.8,0,19.4],[0,0,35.2],[-15.8,0,19.4]],'#2f9444');

/* ===== 경기 전 선발 라인업·타순 직접 선택 ===== */
const POSS={C:'포수','1B':'1루','2B':'2루','3B':'3루',SS:'유격',LF:'좌익',CF:'중견',RF:'우익',DH:'지명'};
const fAvg=v=>{const n=parseFloat(v);return isFinite(n)?n.toFixed(3).replace(/^0/,''):'-'};
function hView(d){const sp=matchSpecial(d.name,'H');return{c:sp?+sp.contact:+d.contact||0,p:sp?+sp.power:+d.power||0,avg:sp?'-':fAvg(d.avg),hr:sp?'-':(d.hr??'-'),sp:!!sp}}
function preLineup(i,sortK){const r=S.rosters[i];sortK=sortK||'cp';
  const dup=FIELD_POS.filter(p=>r.lineup.filter(d=>posCode(d.pos)===p).length!==1);
  const benchSorted=r.bench.map((d,j)=>({d,j})).sort((a,b)=>{const A=hView(a.d),B=hView(b.d);
    return sortK==='c'?B.c-A.c:sortK==='p'?B.p-A.p:sortK==='avg'?(parseFloat(B.avg)||0)-(parseFloat(A.avg)||0):sortK==='hr'?(+B.hr||0)-(+A.hr||0):(B.c+B.p)-(A.c+A.p)});
  const swapOpts=benchSorted.map(({d,j})=>{const v=hView(d);return`<option value="${j}">${v.sp?'★':''}${esc(d.name)} · ${d.pos?posK(posCode(d.pos)||d.pos)+' · ':''}컨${v.c} 파${v.p}${v.avg!=='-'?' · '+v.avg:''}</option>`}).join('');
  const lrow=(d,j)=>{const v=hView(d);return`<tr><td><b style="color:var(--gold)">${j+1}</b></td>
    <td class="l">${v.sp?'<span class=star>★</span>':''}${esc(d.name)} ${tIcons(d)} <small style="color:#8fc3c9">${{R:'우',L:'좌',S:'양'}[HAND_OVR['b:'+d.name]||(matchSpecial(d.name,'H')||d).hand]||''}</small></td>
    <td><select data-pos="${j}" class="mini" style="max-width:54px;${posBad(Object.assign({},d,{pos:posCode(d.pos)}))?'color:#ff4d4d;font-weight:700;border-color:#ff4d4d':''}" title="본 포지션: ${esc(natK(d))}">${FIELD_POS.map(p=>`<option value="${p}" ${posCode(d.pos)===p?'selected':''}>${POSS[p]}</option>`).join('')}</select></td>
    <td>${v.avg}</td><td>${v.hr}</td><td><b>${v.c}</b></td><td><b>${v.p}</b></td>
    <td style="white-space:nowrap"><button class="mbtn" data-up="${j}" ${j?'':'disabled'}>▲</button><button class="mbtn" data-dn="${j}" ${j<8?'':'disabled'}>▼</button></td>
    <td><select data-sw="${j}" class="mini" style="max-width:52px"><option value="">교체</option>${swapOpts}</select></td></tr>`};
  const brow=({d,j})=>{const v=hView(d);return`<tr><td class="l">${v.sp?'<span class=star>★</span>':''}${esc(d.name)}</td><td style="white-space:nowrap;font-size:11px">${esc(natK(d)||'-')}</td><td>${v.avg}</td><td>${v.hr}</td><td>${v.c}</td><td>${v.p}</td>
    <td><select data-in="${j}" class="mini" style="max-width:70px"><option value="">투입</option>${r.lineup.map((x,q)=>`<option value="${q}">${q+1}번 대신</option>`).join('')}</select></td></tr>`};
  const prow=(d,j)=>{const sp=matchSpecial(d.name,'P'),s=sp||d,a=curArs(d);
    return`<tr ${j===0?'class="now"':''}><td>${j===0?'<b style="color:var(--gold)">선발</b>':`<button class="mbtn" data-sp="${j}">선발로</button>`}</td>
    <td class="l">${sp?'<span class=star>★</span>':''}${esc(d.name)}<br><small style="color:#8fc3c9">${d.role==='SP'?'선발':d.role==='RP'?'구원':''} ${s.hand==='L'?'좌':'우'}${{over:'',side:' 사이드',under:' 언더'}[a.arm]||''}</small></td>
    <td>${d.era!=null&&d.era!==''?(+d.era).toFixed(2):'-'}</td><td style="white-space:normal;font-size:11px;text-align:left;min-width:110px">${a.ars.map(x=>`${x.n} ${x.v}`).join(' · ')}</td></tr>`};
  modal(`<h3>${esc(S.names[i])} 라인업·타순</h3>
   <p class="note">순서는 ▲▼, 포지션은 칸에서 고르고, <b style="color:#ff4d4d">빨간 포지션</b>은 본 포지션이 아니에요(컨택·파워 -50%, 실책 +50%p, 지명타자는 예외). [교체]로 벤치 선수와 바꿔요. 벤치 표의 [투입]으로도 바꿀 수 있어요. 컨=컨택, 파=파워.</p>
   ${dup.length?`<p class="note" style="color:#ff8a7a">⚠ 포지션 확인: ${dup.map(posK).join(', ')} — 포지션마다 한 명씩 있어야 해요</p>`:''}
   <h4>선발 타순</h4><div style="overflow-x:auto"><table class="pt lu"><tr><th>#</th><th class="l">선수</th><th>포지션</th><th>타율</th><th>홈런</th><th>컨</th><th>파</th><th>순서</th><th>교체</th></tr>${r.lineup.map(lrow).join('')}</table></div>

   <h4>벤치</h4><div class="seg" id="bsort">${[['cp','종합'],['c','컨택'],['p','파워'],['avg','타율'],['hr','홈런']].map(([k,l])=>`<button data-v="${k}" class="${sortK===k?'on':''}">${l}</button>`).join('')}</div>
   <div style="overflow-x:auto"><table class="pt lu"><tr><th class="l">선수</th><th>포지션</th><th>타율</th><th>홈런</th><th>컨</th><th>파</th><th>투입</th></tr>${benchSorted.map(brow).join('')||'<tr><td colspan="7">없음</td></tr>'}</table></div>
   <h4>투수 (선발 지정)</h4><div style="overflow-x:auto"><table class="pt lu"><tr><th></th><th class="l">투수</th><th>ERA</th><th>구종·구속</th></tr>${r.pitchers.map(prow).join('')}</table></div>
   <div class="row"><button class="btn sm gray" id="ars">⚾ 좌우·구종 편집</button><button class="btn sm gold" id="cl">완료</button></div>`,el=>{
   const re=()=>preLineup(i,sortK);

   el.querySelectorAll('[data-dn]').forEach(b=>b.onclick=()=>{const j=+b.dataset.dn;[r.lineup[j+1],r.lineup[j]]=[r.lineup[j],r.lineup[j+1]];re()});
   el.querySelectorAll('[data-pos]').forEach(s=>s.onchange=()=>{r.lineup[+s.dataset.pos].pos=s.value;re()});
   const swap=(lj,bj)=>{const a=r.lineup[lj],b=r.bench[bj];const np=posCode(a.pos)||'DH';r.bench[bj]=Object.assign({},a);r.lineup[lj]=Object.assign({},b,{pos:np});re()};
   el.querySelectorAll('[data-sw]').forEach(s=>s.onchange=()=>{if(s.value!=='')swap(+s.dataset.sw,+s.value)});
   el.querySelectorAll('[data-in]').forEach(s=>s.onchange=()=>{if(s.value!=='')swap(+s.value,+s.dataset.in)});
   el.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>{const j=+b.dataset.sp;const p=r.pitchers.splice(j,1)[0];r.pitchers.unshift(p);re()});
   el.querySelector('#bsort').onclick=e=>{const b=e.target.closest('button');if(b)preLineup(i,b.dataset.v)};
   el.querySelector('#auto').onclick=()=>{const v=r.lineup.map(d=>{const h=hView(d);return Object.assign({},d,{contact:h.c,power:h.p,_o:d})});r.lineup=battingOrder(v).map(x=>x._o);re()};
   el.querySelector('#ars').onclick=()=>arsModal(i);
   el.querySelector('#cl').onclick=()=>{closeModal();if(!G&&$('#overlay').classList.contains('on'))showSetup()}})}

/* ===== 누적 기록실: 팀별 보기 + 정렬 ===== */
const CS={tab:'bat',team:'',sort:{bat:['PA',-1],pit:['IP',-1],team:['W',-1]}};
const f3n=v=>isFinite(v)?v.toFixed(3).replace(/^0/,''):'-';
const BCOLS=[['G','경기'],['PA','타석'],['AB','타수'],['H','안타'],['RBI','타점'],['HR','홈런'],['SB','도루'],['CS','도루<br>실패'],['D2','2루타'],['D3','3루타'],['BBH','사<br>사구'],['AVG','타율',f3n],['OBP','출루율',f3n],['SLG','장타율',f3n],['OPS','OPS',f3n]];
const PCOLS=[['G','경기'],['W','승'],['L','패'],['HLD','홀드'],['SV','세이브'],['IP','이닝',v=>`${Math.floor(v)}${v%1?' '+Math.round(v%1*3)+'/3':''}`],['ERA','ERA',v=>isFinite(v)?v.toFixed(2):'-'],['K','삼진'],['BB','사<br>사구'],['H','피<br>안타'],['HR','피<br>홈런'],['NP','투구<br>수']];
const TCOLS=[['TG','경기',v=>v||'-'],['W','승',v=>v??'-'],['L','패',v=>v??'-'],['WP','승률',f3n],['R','득점'],['HR','홈런'],['AVG','타율',f3n],['OPS','OPS',f3n],['ERA','ERA',v=>isFinite(v)?v.toFixed(2):'-'],['K','투수<br>삼진']];
function bVals(s){const tb=s.H+s.D2+2*s.D3+3*s.HR,o=(s.AB+s.BB+s.HBP+s.SF),obp=o?(s.H+s.BB+s.HBP)/o:NaN,slg=s.AB?tb/s.AB:NaN;
  return Object.assign({},s,{SB:s.SB||0,CS:s.CS||0,BBH:s.BB+s.HBP,AVG:s.AB?s.H/s.AB:NaN,OBP:obp,SLG:slg,OPS:isFinite(obp)&&isFinite(slg)?obp+slg:NaN})}
function pVals(s){return Object.assign({},s,{IP:s.OUT/3,ERA:s.OUT?s.ER*27/s.OUT:NaN})}
function sortRows(rows,[k,dir]){return rows.sort((a,b)=>{const x=a.v[k],y=b.v[k];const fx=isFinite(x),fy=isFinite(y);if(!fx&&!fy)return 0;if(!fx)return 1;if(!fy)return -1;return dir*(x-y)||a.n.localeCompare(b.n)})}
function sTable(first,cols,rows,sk,sub){

/* ===== 기록 링크(압축+base64url) ===== */
const REC_BASE=(/^https?:$/.test(location.protocol)&&!/claude|localhost|127\.0\.0\.1/.test(location.hostname))?location.origin+location.pathname:'https://claude.ai/artifact/4C9RojgQTjxeijB9vQ4MF8';
const b64u=u8=>{let s='';for(let i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const ub64=t=>{t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const s=atob(t),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u};
async function pipeBytes(u8,stream){return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(stream)).arrayBuffer())}
async function encRec(d){const raw=new TextEncoder().encode(JSON.stringify(d));
  try{return 'z'+b64u(await pipeBytes(raw,new CompressionStream('deflate-raw')))}catch(e){return 'j'+b64u(raw)}}
async function decRec(txt){txt=(txt||'').trim();if(!txt)return null;
  try{const m=txt.match(/rec=([A-Za-z0-9_-]+)/);let d;
    if(m){const c=m[1],u=ub64(c.slice(1));d=JSON.parse(new TextDecoder().decode(c[0]==='z'?await pipeBytes(u,new DecompressionStream('deflate-raw')):u))}
    else d=JSON.parse(txt);
    return d&&d.bat&&d.pit?d:null}catch(e){return null}}
async function copyText(t){try{await navigator.clipboard.writeText(t);return true}catch(e){}
  try{const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();const ok=document.execCommand('copy');a.remove();return ok}catch(e){return false}}
async function recFromHash(){if(!/rec=/.test(location.hash))return;const d=await decRec(location.hash);try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  if(!d)return;const cur=loadCareer();
  modal(`<h3>기록 불러오기</h3><p class="note">링크에 담긴 기록(저장 경기 ${d.games}개)을 불러올까요?<br>이 기기의 현재 기록(${cur.games}개)은 덮어써져요.</p>
   <div class="row"><button class="btn sm gold" id="ry">불러오기</button><button class="btn sm gray" id="rn">취소</button></div>`,el=>{

async function cloudPush(k,data){if(!CLOUD.ok||!CLOUD.ref[k])return;if(CLOUD.busy[k]){CLOUD.pend[k]=data;return}
  CLOUD.busy[k]=true;try{await CLOUD.ref[k].set({json:JSON.stringify(data),at:Date.now()})}catch(e){try{await new Promise(r=>setTimeout(r,800+Math.random()*800));await CLOUD.ref[k].set({json:JSON.stringify(data),at:Date.now()})}catch(e2){}}
  CLOUD.busy[k]=false;if(CLOUD.pend[k]){const d=CLOUD.pend[k];CLOUD.pend[k]=null;cloudPush(k,d)}}

  try{const h=await CLOUD.ref.hand.get();let hd=null;try{hd=h.exists?JSON.parse(h.data().json):null}catch(e){}

}catch(e){}}

function graphEnc(root){const ids=new Map();let n=0;
  const enc=v=>{if(v===null||typeof v!=='object')return typeof v==='function'||typeof v==='undefined'?null:v;
    if(ids.has(v))return{$r:ids.get(v)};const id=n++;ids.set(v,id);
    if(Array.isArray(v))return{$i:id,$a:v.map(enc)};const o={};for(const k in v){const x=v[k];if(typeof x==='function'||x instanceof Node)continue;o[k]=enc(x)}return{$i:id,$o:o}};
  return enc(root)}
function graphDec(root){const tab={};
  const dec=v=>{if(v===null||typeof v!=='object')return v;if('$r' in v)return tab[v.$r];
    if('$a' in v){const a=[];tab[v.$i]=a;v.$a.forEach(x=>a.push(dec(x)));return a}
    const o={};tab[v.$i]=o;for(const k in v.$o)o[k]=dec(v.$o[k]);return o};
  return dec(root)}

  const back=ts.length>1?ts.map((_,k)=>ts[(i+ts.length-1-k)%ts.length]).slice(0,ts.length-1).reverse():[];   // 뒤에 겹쳐 놓인 나머지 특성(반투명)

/* ===== v6.2 주력(달리기) 스탯: 20~99. 기본값 = 포지션 + 파워(무거울수록 느림)·컨택 보정 + 선수별 고정 편차 + 대도·바람의아들. 선수 편집에서 직접 바꿀 수 있음 ===== */
let SPD_OVR=LS.get('dny_spd',{})||{};
const saveSpd=()=>LS.set('dny_spd',SPD_OVR);
const SPD_POS={CF:68,SS:64,'2B':61,LF:57,RF:55,'3B':50,'1B':40,C:34,DH:42};
function spdBase(b){if(!b)return 50;let h=7;for(const ch of String(b.name))h=(h*31+ch.charCodeAt(0))>>>0;
  const p0=(b.nat&&b.nat[0])||(typeof posCode==='function'&&posCode(b.pos))||b.pos;let v=(SPD_POS[p0]??50)-((b.power||52)-52)*0.35+((b.contact||58)-58)*0.15+((h%13)-6);
  if(hasTrait(b,'대도'))v+=12;if(hasTrait(b,'바람의아들'))v+=15;return Math.round(clamp(v,20,99))}
function spd(b){if(!b)return 50;const o=SPD_OVR[b.name];return o!=null&&o!==''?+o:spdBase(b)}
const spK=b=>(spd(b)-55)/45;   // 55=보통, 100이면 +1
const csD=()=>fieldTeam().lineup.some(x=>x&&x.pos==='C'&&hasTrait(x,'철통 보안'))?0.1:0;   // 철통 보안 포수
function stealFrom(){const B=G.bases;
  if(B[0]&&!B[1]&&(hasTrait(B[0].b,'대도')||prOK(B[0].b)||hasTrait(B[0].b,'바람의아들'))&&R()<(hasTrait(B[0].b,'바람의아들')?0.5:0.25))return 1;
  if(B[0]&&!B[1]&&spd(B[0].b)>=62&&R()<(spd(B[0].b)-58)*0.011)return 1;   // 발 빠른 주자는 특성 없이도 시도
  if(B[1]&&!B[2]&&prOK(B[1].b)&&R()<0.2)return 2;return 0}
function stealRes(){const p=st.pitch;if(!p||!p.steal||p.stealDone||p.hbp)return false;p.stealDone=true;const B=G.bases,pit=fieldTeam().pitcher;
  if(p.steal===3){const r=B[2];if(!r)return false;
    if(R()<0.07*(1+0.6*spK(r.b))){G.bases=[B[0],B[1],null];r.b.st.sb=(r.b.st.sb||0)+1;log(`${r.b.name}: 홈스틸 성공!! 👟`);score([r],null,false);st.wpNote=(st.wpNote?st.wpNote+' · ':'')+'👟 홈스틸 성공!';updateHUD();return false}
    G.bases=[B[0],B[1],null];G.outs++;pit.st.outs++;r.b.st.cs=(r.b.st.cs||0)+1;log(`${r.b.name}: 홈스틸 실패`);
    if(G.outs>=3){markPitch('S','홈스틸 실패');finishPitch('홈스틸 실패','out',false,'이닝 종료');return true}
    st.wpNote=(st.wpNote?st.wpNote+' · ':'')+'홈스틸 실패';updateHUD();return false}
  if(p.steal===2){const r=B[1];if(!r||B[2])return false;
    if(R()<Math.min(0.97,0.78+0.12*spK(r.b))-csD()){G.bases=[B[0],null,r];r.b.st.sb=(r.b.st.sb||0)+1;log(`${r.b.name}: 3루 도루 성공 👟`);st.wpNote=(st.wpNote?st.wpNote+' · ':'')+'👟 3루 도루 성공';updateHUD();return false}
    G.bases=[B[0],null,B[2]];G.outs++;pit.st.outs++;r.b.st.cs=(r.b.st.cs||0)+1;log(`${r.b.name}: 3루 도루 실패(도루사)`);
    if(G.outs>=3){markPitch('S','도루사');finishPitch('도루사!','out',false,'이닝 종료');return true}
    st.wpNote=(st.wpNote?st.wpNote+' · ':'')+'도루사';updateHUD();return false}
  const r=B[0];if(!r||B[1])return false;
  if(R()<Math.min(0.97,clamp(0.6+0.2*spK(r.b),0.3,0.9)+(hasTrait(r.b,'대도')?0.10:0)+(prOK(r.b)?0.2:0))-csD()){G.bases=[null,r,B[2]];r.b.st.sb=(r.b.st.sb||0)+1;log(`${r.b.name}: 2루 도루 성공 👟`);st.wpNote=(st.wpNote?st.wpNote+' · ':'')+'👟 도루 성공';updateHUD();return false}
  G.bases=[null,B[1],B[2]];G.outs++;pit.st.outs++;r.b.st.cs=(r.b.st.cs||0)+1;log(`${r.b.name}: 2루 도루 실패(도루사)`);
  if(G.outs>=3){markPitch(G.strikes<2?'S':'S','도루사');finishPitch('도루사!','out',false,'이닝 종료');return true}
  st.wpNote=(st.wpNote?st.wpNote+' · ':'')+'도루사';updateHUD();return false}

/* ===== 희생번트 ===== */
function canBunt(){const B=G.bases;return !!(G&&!G.halt&&st.mode==='ready'&&!st.buntNext&&!B[2]&&(B[0]||B[1])&&G.outs<2)}
function canSqueeze(){const B=G&&G.bases;return !!(G&&!G.halt&&st.mode==='ready'&&!st.buntNext&&B[2]&&G.outs<2)}
function resolveBunt(){st.swung=true;st.buntAt=NOW;{const t=batTeam();t.tk=(t.tk??0.55)*0.9}const r=R();
  if(st.buntNext==='squeeze'){
    const frog=hasTrait(curBatter(),'개구리번트'),jp=frog&&/일본|NPB/.test(clubOf(fieldTeam()));
    if(jp&&r<0.995){const th=(R()*2-1)*28,dist=7+R()*4;return startHit({type:'gb',th,dist,res:'OUT',how:'BUNT',bk:'sq',fielder:pick(['P','C','1B','3B']),great:false,T:0.9,h:0.3,land:P(dist,th),trait:'개구리번트'})}
    if(r<(frog?0.22-0.15:0.22)){st.buntNext=false;markPitch('S','번트 파울');if(G.strikes>=2)return strikeout(false,'스리번트 삼진!');G.strikes++;st.ballAnim='foul';st.foulT0=NOW;st.foulDir=R()<.5?-1:1;return finishPitch('번트 파울','foul',false,'3루 주자 귀루')}
    if(r<0.30){st.buntNext=false;markPitch('S','번트 헛스윙');const B=G.bases,pit=fieldTeam().pitcher;B[2]=null;G.outs++;pit.st.outs++;log(`${curBatter().name}: 스퀴즈 실패 — 3루 주자 협살 아웃`);
      if(G.outs>=3)return finishPitch('스퀴즈 실패!','out',false,'3루 주자 협살');
      if(G.strikes>=2)return strikeout(false,'번트 헛스윙 삼진!');G.strikes++;return finishPitch('스퀴즈 실패!','out',false,'3루 주자 협살 아웃')}
    const kind=r<0.88?'sq':r<0.95?'sqhome':'sqsafe';const th=(R()*2-1)*28,dist=7+R()*4;
    return startHit({type:'gb',th,dist,res:'OUT',how:'BUNT',bk:kind,fielder:pick(['P','C','1B','3B']),great:false,T:0.9,h:0.3,land:P(dist,th)})}
  if(r<0.39+0.55&&r>=0.55&&!hasTrait(curBatter(),'개구리번트')){// 번트 파울 (39%) — 개구리번트는 파울 없음
    st.buntNext=false;
    if(G.strikes>=2){markPitch('S','번트 파울');return strikeout(false,'스리번트 삼진!')}
    markPitch('S','번트 파울');G.strikes++;st.ballAnim='foul';st.foulT0=NOW;st.foulDir=R()<.5?-1:1;return finishPitch('번트 파울','foul',false,'')}
  const kind=r<0.55?'ok':r<0.97?'dp':'lead';const th=(R()*2-1)*28,dist=7+R()*4;
  startHit({type:'gb',th,dist,res:'OUT',how:'BUNT',bk:kind,fielder:pick(['P','C','1B','3B']),great:false,T:0.9,h:0.3,land:P(dist,th)})}
function applyBunt(h){const b=curBatter(),pit=fieldTeam().pitcher,B=G.bases,me={b,p:pit};b.st.pa++;let txt;
  if(h.bk==='sq'||h.bk==='sqsafe'||h.bk==='sqhome'){let sc=[];
    if(h.bk==='sqhome'){b.st.ab++;G.outs++;pit.st.outs++;B[2]=null;if(B[1]){B[2]=B[1];B[1]=null}if(B[0]){B[1]=B[0];B[0]=null}B[0]=me;txt='홈 승부 아웃 — 타자 1루 세이프'}
    else{sc.push(B[2]);B[2]=null;if(B[1]){B[2]=B[1];B[1]=null}if(B[0]){B[1]=B[0];B[0]=null}
      if(h.bk==='sq'){b.st.sh++;G.outs++;pit.st.outs++;txt='스퀴즈 성공!'}else{b.st.ab++;B[0]=me;txt='스퀴즈 — 올 세이프!'}}
    if(sc.length)score(sc,b,true);
    st.buntNext=false;log(`${b.name}: ${txt}${sc.length?' +1점':''}`);return finishPitch(txt,h.bk==='sqhome'?'out':'hit',true,sc.length?'+1점':'')}
  if(h.bk==='ok'){b.st.sh++;G.outs++;pit.st.outs++;if(B[1]){B[2]=B[1];B[1]=null}if(B[0]){B[1]=B[0];B[0]=null}txt='희생번트 성공!'}
  else if(h.bk==='dp'){b.st.ab++;G.outs+=2;pit.st.outs+=2;if(B[1]){B[1]=null;if(B[0]){B[1]=B[0];B[0]=null}}else B[0]=null;txt='번트 병살!'}
  else{b.st.ab++;G.outs++;pit.st.outs++;if(B[1]){B[1]=null;if(B[0])B[1]=B[0];B[0]=me}else B[0]=me;txt='선행주자 아웃'}
  st.buntNext=false;log(`${b.name}: ${txt}`);finishPitch(txt,h.bk==='ok'?'hit':'out',true,'')}

function swapInT(t,old,q,tag){const i=t.lineup.indexOf(old);if(i<0)return false;q.pos=old.pos;if(tag==='pinchRun')q.offField=true;q.curHand=q.hand||(R()<.5?'R':'L');t.used.push(old);t.lineup[i]=q;q.appeared=true;q[tag]=true;return true}
function subDo(k,a,b){if(!G)return false;const ft=fieldTeam(),bt=batTeam();
  if(k==='P'){const q=ft.bullpen[a];if(!q)return false;ft.bullpen.splice(a,1);ft.pitcher.exitLead=leadOf(ft);ft.used.push(ft.pitcher);ft.pitchLog.push(q);enterPitcher(ft,q);log(`투수 교체: ${ft.pitcher.name} → ${q.name}`);ft.pitcher=q;updateHUD();showBanner('투수 교체','strike',q.name);return true}
  if(k==='H'){const q=bt.bench[a];if(!q)return false;bt.bench.splice(a,1);q.pinchPA=true;const old=bt.lineup[bt.idx];q.pos=old.pos;q.curHand=q.hand||(R()<.5?'R':'L');bt.used.push(old);bt.lineup[bt.idx]=q;q.appeared=true;q.offField=true;log(`대타: ${old.name} → ${q.name}`);updateHUD();showBanner('대타!','hit',q.name);return true}
  if(k==='R'){const r=G.bases[a],q=bt.bench[b];if(!r||!q)return false;const old=r.b;if(!swapInT(bt,old,q,'pinchRun')){showBanner('교체 불가','foul','');return false}bt.bench.splice(b,1);G.bases[a]=Object.assign({},r,{b:q});log(`대주자: ${old.name} → ${q.name}`);updateHUD();showBanner('대주자!','hit',q.name);return true}
  if(k==='D'){const old=ft.lineup[a],q=ft.bench[b];if(!old||!q||!swapInT(ft,old,q,'defSub'))return false;ft.bench.splice(b,1);log(`대수비: ${old.name} → ${q.name} (${posK(q.pos)})`);updateHUD();showBanner('대수비','strike',q.name);return true}
  if(k==='F'){const q=ft.lineup[a],np=b;if(!q||!POSK[np])return false;const o=ft.lineup.find(x=>x!==q&&x.pos===np);if(o)o.pos=q.pos;log(`수비 위치: ${q.name} ${POSK[q.pos]}→${POSK[np]}${o?` / ${o.name} ${POSK[np]}→${POSK[o.pos]}`:''}`);q.pos=np;updateHUD();return true}
  return false}

function rulesModal(){modal(`<h3>규칙</h3><div class="note" style="font-size:14px;line-height:1.6">
 <b>모드</b> — <b>투수</b>: 조이스틱으로 코스, 버튼으로 구종을 고르고 [투구]. 빨간 십자가 조준점, 점선 원이 제구 오차 범위(제구 낮고 지칠수록 커짐). 타격은 컴퓨터. <b>타자</b>: 두 사람이 번갈아 투구·타격(기존). <b>경기</b>: A팀 공격은 SWING!, 수비는 조이스틱 투구, B팀은 컴퓨터. <b>PvP</b>: 방 코드로 다른 기기와 1:1(방장 A팀·참가자 B팀, 작전은 내 팀 선수 교체만 가능, 번트는 번트 버튼).<br><b>진행</b> — [투구] 버튼(키보드 Enter)을 눌러야 공을 던져요.<br><b>타격</b> — 공이 노란 스트라이크 존에 들어올 때 SWING!(Space) 너무 빠르거나 늦으면 헛스윙, 살짝 어긋나면 파울. 파울로는 삼진이 안 돼요. 존 밖 공은 치기 어려워요.<br>
 <b>투구폼</b> — 사이드암은 낮고 옆에서 나와 횡변화가 크고, 언더핸드는 무릎 높이에서 떠오르듯 들어와요.<br><b>투구</b> — 투수별 구종(CSV)이 있으면 그 구종 중에서, 없으면 체크된 구종 중 무작위. 몸쪽으로 크게 빠진 공에 맞으면 <b>몸에 맞는 공</b>(1루 진루, 사사구 기록). 투수의 구속·제구·구위·체력이 반영되고, 투구수가 늘면 체력이 떨어져 제구와 구위가 나빠져요.<br>
 <b>특성</b> — 선수 카드 오른쪽 육각형 아이콘. 특성이 2개 이상이면 선수 이름을 누를 때마다 바뀌어요. 효과가 켜지면 아이콘이 빛나요.${traitRulesHTML()} <b>타구 판정</b> — 펜스 색 구간 판정은 없어요. 타이밍·파워·투수 구위로 <b>타구 속도</b>와 <b>발사각</b>이 정해지고, 방향과 함께 비거리·체공 시간을 계산해요. 펜스(좌우 95m·중앙 110m)를 넘기면 홈런, 야수가 체공 시간 안에 도달하면 아웃, 못 잡으면 공을 잡아 던지는 시간과 타자 주루 시간을 비교해 1·2·3루타가 결정돼요. 땅볼도 내야수가 따라잡는지·송구가 빠른지로 아웃/내야안타를 판정해요.<br>
 <b>투구 위치</b> — 타석마다 들어온 공의 위치가 존 위에 번호로 표시돼요(노랑=스트라이크·헛스윙·파울, 초록=볼, 파랑=타격).<br><b>수비</b> — 넓은 수비 범위(전체 수비 성공률 +4%p 상향). 외야수는 10%(중견수는 15%) 확률로 호수비(한 단계 감소).<br>
 <b>병살·태그업</b> — 1루 주자 + 2아웃 미만 땅볼은 75% 병살. 3루 주자 + 2아웃 미만 외야 플라이는 90% 득점.<br>

  tp.innerHTML=`<b>${esc(t)}</b>${UNIQUE_T.includes(t)?' <small class="tuq">고유 기술</small>':''}<div>${esc(TDESC(t))}</div>${TRESTRICT[t]&&TRESTRICT[t].pos?`<small class="trs">제한: ${TRESTRICT[t].pos.map(p=>posK(p)).join('·')}</small>`:''}`;
  tp.classList.add('on');const w=tp.offsetWidth,h=tp.offsetHeight;tp.style.left=Math.max(6,Math.min(innerWidth-w-6,x-w/2))+'px';tp.style.top=(y-h-14<6?y+18:y-h-14)+'px'}
function tipHide(){$('#ttip').classList.remove('on')}
document.addEventListener('pointerover',e=>{if(e.pointerType!=='mouse')return;const s=e.target.closest&&e.target.closest('svg.hexi[data-t]');if(s){const r=s.getBoundingClientRect();tipShow(s,r.left+r.width/2,r.top)}});
document.addEventListener('pointerout',e=>{if(e.pointerType!=='mouse')return;const s=e.target.closest&&e.target.closest('svg.hexi[data-t]');if(s&&!(e.relatedTarget&&s.contains(e.relatedTarget)))tipHide()});
document.addEventListener('pointerdown',e=>{const s=e.target.closest&&e.target.closest('svg.hexi[data-t]');if(s&&e.pointerType!=='mouse'){const r=s.getBoundingClientRect();tipShow(s,r.left+r.width/2,r.top);return}if(!s)tipHide()},true);
/* 예상 궤적(투구 모드·내가 던질 때) */
let TRAJ=LS.get('dny_traj',true);
function pitchPreview(pit,n,aim){const ptp=PITCHES.find(x=>x.n===n);if(!ptp)return null;const sgn=pit.hand==='L'?-1:1,arm=pit.arm||'over';let bx=ptp.bx*sgn*MOVE,by=ptp.by*MOVE;
  if(/커브/.test(n)&&hasTrait(pit,'12-6')){bx*=1.15;by*=1.25}if(/슬라이더|스위퍼/.test(n)&&hasTrait(pit,'슬러브?')){bx*=1.2;by*=1.1}if(/포크|스플리터|스플릿/.test(n)&&hasTrait(pit,'조핑크')){by*=1.35;bx*=0.85}
  if(/슬라이더|스위퍼/.test(n)&&hasTrait(pit,'무등산폭격기')){bx*=1.35;by*=1.15}if(/커브/.test(n)&&hasTrait(pit,'무쇠팔')){bx*=1.25;by*=1.4}
  if(FASTB.includes(n)&&hasTrait(pit,'뱀직구'))bx=bx*1.7+(bx>=0?0.12:-0.12)*sgn;
  const rel=arm==='under'?[-0.8*sgn,0.55,17.0]:arm==='side'?[-1.0*sgn,1.2,17.1]:[-0.5*sgn,1.85,17.2];if(arm==='side'){bx-=0.16*sgn;by+=0.03}else if(arm==='under'){bx-=0.12*sgn;by+=0.16}
  return{tx:aim.x,ty:aim.y,bx,by,k:ptp.k,rev:ptp.rev||0,rel}}
const TRAJ_C=['#ffd23f','#5ad1ff','#ff7ab6','#7dff8a','#ffa24c','#c59bff','#ffffff','#ff5a5a','#9be7c4'];
function drawTraj(){if(!PAD_ON||!TRAJ||!G)return;const pit=fieldTeam().pitcher,L=padPitches();
  L.forEach((n,i)=>{if(n!==st.selP)return;const q=pitchPreview(pit,n,st.aim);if(!q)return;const sel=true;ctx.strokeStyle=TRAJ_C[i%TRAJ_C.length];ctx.globalAlpha=sel?0.85:0.4;ctx.lineWidth=sel?3.5:2;ctx.beginPath();let f=true;
    for(let t=0.04;t<=1.0001;t+=0.04){const m=pt(pitchPos(q,t));if(!m)continue;if(f){ctx.moveTo(m.x,m.y);f=false}else ctx.lineTo(m.x,m.y)}ctx.stroke();
    if(sel){const m=pt(pitchPos(q,1));if(m){ctx.fillStyle=TRAJ_C[i%TRAJ_C.length];ctx.beginPath();ctx.arc(m.x,m.y,3,0,7);ctx.fill()}}});ctx.globalAlpha=1}
function syncTrajBtn(){const b=$('#trajB');if(b){b.textContent='궤적 '+(TRAJ?'ON':'OFF');b.classList.toggle('on',!!TRAJ)}}
$('#trajB').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();TRAJ=!TRAJ;LS.set('dny_traj',TRAJ);syncTrajBtn()});syncTrajBtn();
/* 빠른 진행: 남은 투구를 컴퓨터가 빠르게 진행 */
const hIdx=()=>G.inning*2+(G.half?1:0);
function ffModal(){if(!G||G.over)return showBanner('경기 중이 아니에요','foul','');if(MODE==='pvp')return showBanner('빠른 진행 불가','foul','PvP에선 쓸 수 없어요');
  const myAtk=MODE==='bat'||humanBat(),myDef=MODE==='bat'||humanPitch()||(MODE==='game'&&!humanBat());
  modal(`<h3>⏩ 빠른 진행</h3><p class="note">선택한 구간을 컴퓨터가 대신 빠르게 진행해요(양 팀 모두 컴퓨터 판단). ${halfTxt()} ${G.outs}아웃 진행 중.</p>
   <div class="tacg"><button class="btn" id="ffA" ${myAtk&&batTeam()===G.teams[0]||MODE==='bat'?'':'disabled'}>공격 건너뛰기</button><button class="btn" id="ffD" ${MODE==='bat'||fieldTeam()===G.teams[0]?'':'disabled'}>수비 건너뛰기</button><button class="btn" id="ff1">1이닝 건너뛰기</button>
   <button class="btn" id="ff3">3이닝 건너뛰기</button><button class="btn gold" id="ffE">결과 보기</button></div>`,el=>{
   const go=k=>{closeModal();fastForward(k)};el.querySelector('#ffA').onclick=()=>go(1);el.querySelector('#ffD').onclick=()=>go(1);el.querySelector('#ff1').onclick=()=>go(2);el.querySelector('#ff3').onclick=()=>go(6);el.querySelector('#ffE').onclick=()=>go(999)})}
function fastForward(n){if(!G||G.over)return;showBanner('⏩ 빠른 진행 중…','strike','');setTimeout(()=>{const keep=MODE,tgt=hIdx()+n,real=NOW;MODE='cpu';let t=NOW,it=0;
  try{if(st.mode==='ready'||st.mode==='idle'){}
    while(!G.over&&it++<600000){t+=1/60;NOW=t;if(G.halt&&st.mode==='idle'&&!G.over){closeOverlay();G.halt=false;st.mode='ready';if(hIdx()>=tgt)break}
      if(st.mode==='ready'&&!G.halt&&hIdx()>=tgt)break;update()}}catch(e){console.error(e)}
  MODE=keep;NOW=real;closeOverlay();if(!G.over){G.halt=false;st.mode='ready';st.until=0;st.ballAnim=null;st.camMode='pitch';st._aiT=0;bgKey=''}
  updateHUD();renderPList&&renderPList();if(!G.over)showBanner('빠른 진행 완료',  'hit',`${halfTxt()} · ${esc(G.away.name)} ${tot(G.away)} : ${tot(G.home)} ${esc(G.home.name)}`);else if(!$('#overlay').classList.contains('on'))endGame()},40)}
/* ===== 앱 설치(PWA) ===== */
let DEFER_INSTALL=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();DEFER_INSTALL=e});
if('serviceWorker' in navigator&&location.protocol==='https:'&&!/\/versions\//.test(location.pathname))navigator.serviceWorker.register('sw.js').catch(()=>{});
const IS_APP=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function installModal(){const ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  modal(`<h3>📲 앱으로 설치</h3>${IS_APP()?'<p class="status">✔ 지금 앱으로 실행 중이에요.</p>':''}
   ${DEFER_INSTALL?'<div class="row"><button class="btn gold" id="inB">지금 설치하기</button></div>':''}
   <p class="note">${ios?'<b>아이폰·아이패드(사파리)</b>: 아래쪽 공유 버튼(□↑) → <b>홈 화면에 추가</b> → 추가.':'<b>안드로이드(크롬)</b>: 오른쪽 위 ⋮ 메뉴 → <b>앱 설치</b>(또는 홈 화면에 추가).'}<br><b>PC(크롬·엣지)</b>: 주소창 오른쪽 설치 아이콘(⊕) → 설치.</p>
   <p class="note">한 번 열어 두면 인터넷 없이도 혼자·경기 모드를 할 수 있어요(PvP는 인터넷 필요). 새 버전은 인터넷이 될 때 자동으로 반영돼요.</p>
   <div class="row"><button class="btn sm gray" id="cl">닫기</button></div>`,el=>{el.querySelector('#cl').onclick=closeModal;const b=el.querySelector('#inB');if(b)b.onclick=async()=>{DEFER_INSTALL.prompt();try{await DEFER_INSTALL.userChoice}catch(e){}DEFER_INSTALL=null;closeModal()}})}
$('#btnSwing').addEventListener('pointerdown',e=>{e.preventDefault();doSwing()});
$('#stage').addEventListener('pointerdown',e=>{e.preventDefault();doSwing()});
$('#btnTactic').onclick=tacticModal;
$('#btnPitch').addEventListener('pointerdown',e=>{e.preventDefault();doPitch()});
window.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;if(e.code==='Space'){e.preventDefault();doSwing()}else if(e.code==='Enter'||e.code==='KeyP'){e.preventDefault();doPitch()}});
window.addEventListener('resize',resize);try{new ResizeObserver(()=>{const r=cv.getBoundingClientRect();if(Math.abs(r.width-W)>0.5||Math.abs(r.height-H)>0.5)resize()}).observe(cv)}catch(e){}
['#cardP','#cardB'].forEach(id=>$(id).addEventListener('click',e=>{if(G&&e.target.closest('.nm,.hexes')){const o=id==='#cardP'?fieldTeam().pitcher:curBatter(),n=traitsOf(o).length;if(n>1){T_IDX[o.name]=((T_IDX[o.name]||0)+1)%n;updateHUD();return}}st.cardRt=!st.cardRt;updateHUD()}));cv=$('#cv');ctx=cv.getContext('2d');bg=document.createElement('canvas');bgctx=bg.getContext('2d');
resize();updateHUD();loadDefaultDB().finally(()=>{updateHUD();showStart();recFromHash();
  const L=liveInfo();if(L){const g=L.g,a=g.away,h=g.home;
    modal(`<h3>진행 중이던 경기</h3><p class="note" style="font-size:16px">${esc(a.name)} <b>${tot(a)}</b> : <b>${tot(h)}</b> ${esc(h.name)}<br>${g.inning}회${g.half?'말':'초'} ${g.outs}아웃</p>
      <p class="note">페이지가 다시 열려도 경기는 타석마다 자동 저장돼요.</p>
      <div class="row"><button class="btn gold" id="lv1">이어하기</button><button class="btn gray" id="lv0">새 경기</button></div>`,el=>{
      el.querySelector('#lv1').onclick=()=>{closeModal();resumeLive()};
      el.querySelector('#lv0').onclick=()=>{try{localStorage.removeItem(LIVE_KEY)}catch(e){};closeModal()}})}});cloudInit();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{bgKey=''});
requestAnimationFrame(frame);
</script>
