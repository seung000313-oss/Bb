<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#103e43">
<title>동네야구 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&display=swap" rel="stylesheet">
<style>
:root{--gold:#ffd23f;--blue:#2f7df6;--red:#e8483f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#061517;color:#fff;font-family:'Do Hyeon',sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:'Do Hyeon',sans-serif;font-size:15px;background:#06222a;color:#fff;border:2px solid #000;border-radius:8px;padding:6px 8px;min-width:0;user-select:text;-webkit-user-select:text}
#app{max-width:520px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;background:linear-gradient(#0f3b40,#082427)}
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;background:linear-gradient(#17585f,#0d3337);border-bottom:2px solid #000;gap:6px}
.logo{font-family:'Black Han Sans';font-size:22px;color:#ffe066;-webkit-text-stroke:1px #6b3500;text-shadow:0 2px 0 #6b3500,0 3px 6px rgba(0,0,0,.5);white-space:nowrap}
.logo span{color:#fff;font-size:12px;margin-left:3px;background:var(--red);padding:1px 5px;border-radius:5px;-webkit-text-stroke:0;text-shadow:none;vertical-align:4px;border:1px solid #000}
header .ver,.logo .ver{font-family:system-ui,sans-serif;font-size:10px;font-weight:400;color:#9aa4a8;margin-left:4px;letter-spacing:0;-webkit-text-stroke:0;text-shadow:none;align-self:flex-end}
nav{display:flex;gap:2px;flex-wrap:nowrap;overflow-x:auto}
nav button{font-family:'Black Han Sans';font-size:11px;color:#fff;background:linear-gradient(#2c7a82,#1a5157);border:2px solid #000;border-radius:8px;padding:4px 5px;white-space:nowrap;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.board{display:flex;gap:6px;padding:5px 8px;align-items:center;background:#0a2629}
table.ls{border-collapse:collapse;font-family:'Black Han Sans';font-size:12px;flex:1;background:#061719;border:2px solid #000}
.ls td,.ls th{padding:2px 2px;text-align:center;border-right:1px solid #143a40;font-weight:normal}
.ls th{color:#8fc3c9;font-size:10px}
.ls .tn{text-align:left;max-width:70px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px}
.ls .cur{color:var(--gold)}
.ls .R{color:var(--gold);background:#0f2a2e}
.ls .bat{color:var(--gold)}
.count{display:flex;flex-direction:column;gap:1px;font-family:'Black Han Sans';font-size:11px;line-height:12px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#28393c;margin-left:2px;border:1px solid #000;vertical-align:-1px}
.dot.b.on{background:#3ddc84;box-shadow:0 0 5px #3ddc84}.dot.s.on{background:#ffd23f;box-shadow:0 0 5px #ffd23f}.dot.o.on{background:#ff4d4d;box-shadow:0 0 5px #ff4d4d}
.bases{position:relative;width:40px;height:34px;flex:none}
.bases i{position:absolute;width:11px;height:11px;transform:rotate(45deg);background:#28393c;border:1px solid #000}
.bases i.on{background:var(--gold);box-shadow:0 0 7px var(--gold)}
.stage{position:relative;flex:1;min-height:0;overflow:hidden;border-top:2px solid #000;border-bottom:2px solid #000}
canvas{display:block;width:100%;height:100%}
.camlabel{position:absolute;left:8px;top:6px;font-family:'Black Han Sans';font-size:11px;color:#fff;background:rgba(0,0,0,.45);padding:2px 6px;border-radius:4px;letter-spacing:1px}
.camlabel:before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:#ff3b3b;margin-right:5px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
#inn{position:absolute;right:8px;top:6px;font-family:'Black Han Sans';font-size:13px;background:rgba(0,0,0,.45);padding:2px 7px;border-radius:4px;color:var(--gold)}
#plist{position:absolute;left:6px;top:32px;display:none;background:rgba(0,0,0,.5);border-radius:6px;padding:4px 6px;font-size:11px;line-height:1.55;pointer-events:none;max-width:62%}
#plist div{white-space:nowrap;display:flex;align-items:center;gap:4px}#plist b{font-weight:normal;color:#fff;font-family:'Black Han Sans'}#plist span{color:#cfe9ec}#plist em{font-style:normal;color:#ffe066;margin-left:4px}
.pk{display:inline-block;width:15px;height:15px;border-radius:50%;text-align:center;line-height:15px;font-style:normal;font-family:'Black Han Sans';font-size:10px;color:#fff;border:1px solid #fff}.pk.S{background:#ffb300}.pk.B{background:#2fbf4a}.pk.X{background:#3fa9ff}
#pinfo{position:absolute;right:8px;top:30px;font-family:'Black Han Sans';font-size:15px;color:#fff;-webkit-text-stroke:.6px #000;text-shadow:0 2px 0 #000;opacity:0;transition:opacity .2s;text-align:right}
#pinfo b{color:var(--gold);font-size:22px;font-weight:normal}
#banner{position:absolute;left:0;right:0;top:30%;text-align:center;pointer-events:none;opacity:0}
#banner.show{animation:pop 1.3s ease-out forwards}
#banner .t{font-family:'Black Han Sans';font-size:46px;-webkit-text-stroke:2px #000;text-shadow:0 4px 0 #000,0 8px 14px rgba(0,0,0,.6);line-height:1.05}
#banner .s{font-family:'Black Han Sans';font-size:20px;color:#fff;-webkit-text-stroke:1px #000;text-shadow:0 2px 0 #000;margin-top:4px}
#banner.hit .t{color:#7fe0ff}#banner.hr .t{color:#ffd23f;font-size:62px}#banner.k .t{color:#ff6b6b}#banner.strike .t{color:#ffe066;font-size:36px}#banner.ball .t{color:#8ef0a8;font-size:36px}#banner.foul .t{color:#fff;font-size:36px}#banner.out .t{color:#ff9a6b}
@keyframes pop{0%{transform:scale(.3);opacity:0}14%{transform:scale(1.18);opacity:1}24%{transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}
#spTag{position:absolute;left:8px;bottom:8px;font-family:'Black Han Sans';font-size:12px;color:#000;background:linear-gradient(#fff3a0,#ffb800);border:2px solid #000;border-radius:6px;padding:2px 7px;display:none}
.matchup{display:grid;grid-template-columns:1fr auto 1fr;gap:4px;padding:5px 8px;background:#0a2629}
.trow{display:flex;align-items:center;gap:6px;padding:6px 4px;border-bottom:1px solid rgba(255,255,255,.08)}.tnm{flex:1;min-width:0;display:flex;flex-direction:column}.tnm b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tnm small{color:#8fc3c9;font-size:11px}.tbase{display:flex;gap:2px;align-items:center}
.tslot{flex:none;width:76px;display:flex;flex-direction:column;align-items:center;gap:1px;background:rgba(0,0,0,.25);border:1.5px dashed #b89a4a;border-radius:10px;padding:4px 2px;color:#e9cf7a;font:inherit}.tslot small{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:72px}.tslot.on{border-style:solid;background:rgba(226,189,92,.12)}.tslot.lock{border:none;background:none;color:#6f8f93;font-size:11px;justify-content:center}
.hexadd{display:flex;align-items:center;justify-content:center;width:30px;height:33px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:#3b3215;color:#e9cf7a;font-size:20px;font-weight:900}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0}.tcell{display:flex;flex-direction:column;align-items:center;gap:2px;background:linear-gradient(#22343a,#16252a);border:1.5px solid #3c5a5e;border-radius:10px;padding:8px 4px;color:#fff;font:inherit;text-align:center}.tcell b{font-size:12.5px;color:#ffd98a}.tcell small{font-size:10px;color:#a9cdd1;line-height:1.3}.tcell.on{border-color:#ffd23f;box-shadow:0 0 10px rgba(255,210,63,.5)}
.card{cursor:pointer;position:relative}.hexes{position:absolute;right:6px;top:24px;transform:none;display:flex;gap:3px;cursor:pointer}.hexw{display:flex;flex-direction:column;align-items:center}.hexw span{font-size:8.5px;color:#ffe08a;margin-top:-2px;white-space:nowrap;text-shadow:0 1px 0 #000}.hexi{filter:drop-shadow(0 2px 2px rgba(0,0,0,.6))}.hexi.on{animation:hexon 1s infinite}@keyframes hexon{50%{filter:drop-shadow(0 0 7px #ff6a3a) brightness(1.25)}}.hexs{display:inline-block;vertical-align:-4px;margin-left:2px;cursor:pointer;-webkit-tap-highlight-color:transparent}.hexs .hexn{color:#ffe08a;font-size:9px;margin-left:1px}.nm,.hexes,.hexw{cursor:pointer}.hexn{font-size:9px;color:#ffd98a;margin-left:1px;vertical-align:4px}.card .tg{float:right;font-size:9px;color:#8fc3c9;border:1px solid #2b6d74;border-radius:6px;padding:0 4px}.trts{display:flex;flex-wrap:wrap;gap:3px;margin:1px 0}.trt{font-size:10px;background:#3a2a0a;border:1px solid #c9922a;color:#ffd98a;border-radius:8px;padding:0 5px;white-space:nowrap}.trt.on{background:#c9302a;border-color:#ff8a5a;color:#fff;animation:blink 1s infinite}@keyframes blink{50%{opacity:.55}}
.card{background:linear-gradient(#174a50,#0f3438);border:2px solid #000;border-radius:10px;padding:4px 7px;min-width:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
.card .lb{font-family:'Black Han Sans';font-size:10px;color:#8fc3c9}
.card .nm{font-family:'Black Han Sans';font-size:16px;white-space:normal;word-break:keep-all;line-height:1.15;-webkit-text-stroke:.3px #000}
.card .nm.sp{color:var(--gold)}
.card .sub{font-size:13px;color:#cfe9ec;white-space:normal;word-break:keep-all;line-height:1.3;min-height:17px}
.bar{height:6px;background:#1d2a2c;border-radius:3px;overflow:hidden;margin-top:22px;border:1px solid #000}.card:has(.hexes) .nm,.card:has(.hexes) .sub{padding-right:46px}.bar b{display:block;height:100%;background:linear-gradient(90deg,#ff4d4d,#ffd23f 50%,#3ddc84)}
.vs{font-family:'Black Han Sans';align-self:center;color:var(--gold);font-size:18px;-webkit-text-stroke:1px #000}
.ctrl{display:flex;gap:8px;padding:7px 8px calc(8px + env(safe-area-inset-bottom))}
.btn{font-family:'Black Han Sans';border:2px solid #000;border-radius:12px;color:#fff;font-size:17px;padding:9px 14px;background:linear-gradient(#4a96ff,#1f5fd0);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 3px 0 #000;text-shadow:0 2px 0 rgba(0,0,0,.45)}
.btn:active{transform:translateY(2px);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 1px 0 #000}
.btn:disabled{filter:grayscale(1) brightness(.6)}
#btnPitch{font-size:22px;background:linear-gradient(#63e89a,#1f9d55);-webkit-text-stroke:1px #0b4a25;padding:8px 14px}
#btnPitch.ready{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06);filter:brightness(1.2)}}
#btnSwing{flex:1;font-size:30px;background:linear-gradient(#ffe066,#ff9f1c 60%,#f76707);-webkit-text-stroke:1.5px #6b2c00;letter-spacing:3px;padding:8px}
.btn.gray{background:linear-gradient(#64777c,#36464a)}
.btn.red{background:linear-gradient(#ff6b5b,#c92a2a)}
.btn.gold{background:linear-gradient(#ffe066,#ff9f1c);-webkit-text-stroke:1px #6b2c00}
.btn.sm{font-size:14px;padding:6px 10px;border-radius:9px}
.ov{position:fixed;inset:0;background:rgba(3,14,16,.9);display:none;align-items:center;justify-content:center;z-index:20;padding:12px}
.ov.on{display:flex}
#modal{z-index:30;background:rgba(0,0,0,.7)}
.panel{width:100%;max-width:480px;max-height:94vh;max-height:94dvh;overflow:auto;background:linear-gradient(#15494f,#0c2e32);border:3px solid #000;border-radius:16px;padding:14px;box-shadow:inset 0 0 0 2px #2a6a71}
.title{font-family:'Black Han Sans';font-size:46px;text-align:center;color:#ffe066;-webkit-text-stroke:2px #5a2a00;text-shadow:0 4px 0 #5a2a00,0 8px 14px rgba(0,0,0,.5);line-height:1}
.title small{display:block;font-size:16px;color:#fff;-webkit-text-stroke:0;text-shadow:0 2px 0 #000;margin-top:6px;letter-spacing:4px}
h3{font-family:'Black Han Sans';font-weight:normal;margin:0 0 8px;font-size:20px;color:#ffe066;-webkit-text-stroke:.6px #5a2a00}
h4{font-family:'Black Han Sans';font-weight:normal;margin:12px 0 5px;font-size:15px;color:#9fe0e6}
.row{display:flex;gap:6px;align-items:center;margin:6px 0}
.row>*{flex:1}
.seg{display:flex;border:2px solid #000;border-radius:9px;overflow:hidden}
.seg button{flex:1;font-family:'Black Han Sans';background:#123c41;color:#9cc;border:0;padding:7px 0;font-size:15px}
.seg button.on{background:linear-gradient(#ffe066,#ff9f1c);color:#3a1a00}
.lbl{font-size:13px;color:#9fd0d5;flex:none;width:58px}
.note{font-size:13px;color:#a9cfd3;line-height:1.45}
.lr{display:grid;grid-template-columns:22px 62px 1fr auto;gap:4px;align-items:center;margin:3px 0;font-size:14px}
.lr .no{font-family:'Black Han Sans';color:var(--gold);text-align:center}
.lr .sp{font-size:12px;color:#9fd0d5;white-space:nowrap}
.lr .sp.on{color:var(--gold)}
.lr input{padding:4px 6px;font-size:14px}
.list .it{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:7px 9px;margin:4px 0;background:#0c3136;border:2px solid #000;border-radius:9px;font-size:15px}
.list .it.click{cursor:pointer;background:linear-gradient(#1b5a61,#0f3a3f)}
.list .it.click:active{transform:translateY(1px)}
.list .it .r{font-size:12px;color:#a9d3d8;text-align:right}
.list .it.dim{opacity:.45}
.star{color:var(--gold)}
.reg{background:#0b2d32;border:2px solid #000;border-radius:10px;padding:7px;margin:7px 0}
.reg .row{margin:4px 0}
.reg input[type=number]{width:100%}
.reg label{font-size:12px;color:#9fd0d5;display:flex;flex-direction:column;gap:2px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.pgrid label{background:#0c3136;border:2px solid #000;border-radius:8px;padding:6px;font-size:14px;display:flex;gap:5px;align-items:center}
table.pt{border-collapse:collapse;width:100%;font-size:12px;background:#08262a;border:2px solid #000;margin:4px 0}
.pt th,.pt td{padding:4px 1px;text-align:center;border-bottom:1px solid #1d4a50;white-space:nowrap}
.pt th{font-family:'Black Han Sans';font-weight:normal;font-size:10px;color:#9fd0d5;background:#0f383d;white-space:normal;word-break:keep-all;line-height:1.1}
.mini{font-size:12px;padding:2px 3px;border-width:1px}.mbtn{font-size:11px;padding:3px 5px;background:#1d4a50;color:#fff;border:1px solid #000;border-radius:5px;margin:0 1px}.mbtn:disabled{opacity:.3}
.lu td{padding:3px 1px}.lu .l{min-width:64px}.lu .mbtn{padding:3px 4px}.srt th[data-sk]{cursor:pointer}.srt th.on{color:#ffd23f}
.pt .l{text-align:left;padding-left:5px;min-width:76px;max-width:96px;white-space:normal;word-break:keep-all;line-height:1.15}.pt tr.now td{color:#ffd23f}
.logl div{padding:5px 2px;border-bottom:1px solid #1d4a50;font-size:14px}
.logl .ih{color:var(--gold);font-family:'Black Han Sans';font-size:12px;margin-right:4px}
.big{font-family:'Black Han Sans';font-size:58px;text-align:center;-webkit-text-stroke:2px #000;text-shadow:0 5px 0 #000;color:#ffe066;line-height:1.1}
.center{text-align:center}
.jrow{display:flex;justify-content:space-between;background:#0c3136;border:2px solid #000;border-radius:10px;padding:9px 11px;margin:7px 0;font-size:16px}
.jrow .n{font-family:'Black Han Sans';color:var(--gold)}
textarea{width:100%;height:140px;font-size:12px}
.status{font-size:13px;color:#8ef0a8;margin-top:4px;min-height:16px}

/* ===== v4.0 테마: 차분한 야구장 스코어북 톤 (네온·형광 그라데이션 제거, 폰트 유지) ===== */
:root{--gold:#e9c46a;--blue:#3b6ea5;--red:#c0392b;--ink:#0f151c;--line:#2c3a48;--paper:#f4ecd8}
html,body{background:#0f151c}
#app{background:linear-gradient(#17212c,#10171f)}
.top{background:#1a2531;border-bottom:1px solid var(--line)}
.logo{color:var(--paper);-webkit-text-stroke:0;text-shadow:0 1px 0 rgba(0,0,0,.5)}
.logo span{background:#b23a32;border:0;border-radius:4px}
nav button{background:#233142;border:1px solid #34465a;border-radius:6px;box-shadow:none;color:#e6edf3}
.board,.matchup{background:#131b24}
table.ls{background:#0f151c;border:1px solid var(--line)}
.ls td,.ls th{border-right:1px solid #1e2a36}.ls th{color:#93a8bb}.ls .R{background:#18222d}
.dot{background:#263241;border:1px solid #0b1016}.dot.b.on{background:#4caf7a;box-shadow:none}.dot.s.on{background:#e9c46a;box-shadow:none}.dot.o.on{background:#d9534f;box-shadow:none}
.bases i{background:#263241;border:1px solid #0b1016}.bases i.on{box-shadow:none}
.stage{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.card{background:#1a2430;border:1px solid var(--line);box-shadow:none}.card .lb{color:#93a8bb}.card .nm{-webkit-text-stroke:0}.card .sub{color:#d5dee6}
.bar{background:#0f151c;border:1px solid #0b1016}.bar b{background:linear-gradient(90deg,#c0392b,#e9c46a 50%,#4caf7a)}
.vs{-webkit-text-stroke:0;color:#93a8bb}
.btn{border:1px solid rgba(0,0,0,.45);border-radius:10px;background:#3b6ea5;box-shadow:0 2px 0 rgba(0,0,0,.35);text-shadow:none;-webkit-text-stroke:0}
.btn:active{box-shadow:0 0 0 rgba(0,0,0,.35)}
#btnPitch{background:#2e7d5b;-webkit-text-stroke:0}
@keyframes pulse{50%{filter:brightness(1.15)}}
#btnSwing{background:#b23a32;-webkit-text-stroke:0;letter-spacing:2px}
.btn.gray{background:#3d4a57}.btn.red{background:#a83232}
.btn.gold{background:var(--paper);color:#2a2016;-webkit-text-stroke:0}
.ov{background:rgba(9,13,18,.92)}
.panel{background:#18222d;border:1px solid #2f3e4e;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.title{color:var(--paper);-webkit-text-stroke:0;text-shadow:0 2px 0 rgba(0,0,0,.45)}
.title small{color:#93a8bb;text-shadow:none}
h3{color:var(--gold);-webkit-text-stroke:0}h4{color:#9fb6c9}
input,select,textarea{background:#0f151c;border:1px solid #34465a}
.seg{border:1px solid #34465a}.seg button{box-shadow:none;background:#1a2531;color:#93a8bb}.seg button.on{background:var(--paper);color:#2a2016}
#spTag{background:var(--paper);border:1px solid #000}
#banner .t{-webkit-text-stroke:1.5px #000}#banner.hr .t{color:#e9c46a}#banner.hit .t{color:#9fd3f5}
.tcell{background:#1d2935;border:1px solid #34465a}.tslot{background:rgba(0,0,0,.2);border-color:#7d6b3d}
.tbase{flex-wrap:wrap}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="logo">동네야구<span>3D</span><small class="ver">v4.2</small></div>
    <nav>
      <button data-m="pitches">구종</button>
      <button data-m="ars">편집</button>
      <button data-m="line0" id="navA">A팀</button>
      <button data-m="line1" id="navB">B팀</button>
      <button data-m="log">중계</button>
      <button data-m="career">기록실</button>
      <button data-m="rules">규칙</button>
    </nav>
  </header>
  <section class="board">
    <table class="ls" id="ls"></table>
    <div class="count">
      <div>B<span class="dot b"></span><span class="dot b"></span><span class="dot b"></span></div>
      <div>S<span class="dot s"></span><span class="dot s"></span></div>
      <div>O<span class="dot o"></span><span class="dot o"></span></div>
    </div>
    <div class="bases"><i id="b2" style="left:14px;top:2px"></i><i id="b3" style="left:3px;top:13px"></i><i id="b1" style="left:25px;top:13px"></i></div>
  </section>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="camlabel" id="camlabel">PITCH CAM</div>
    <div id="inn"></div>
    <div id="pinfo"></div>
    <div id="plist"></div>
    <div id="banner"><div class="t"></div><div class="s"></div></div>
    <div id="spTag">★ 스페셜</div>
  </div>
  <section class="matchup">
    <div class="card" id="cardP"></div>
    <div class="vs">VS</div>
    <div class="card" id="cardB"></div>
  </section>
  <footer class="ctrl">
    <button class="btn gray" id="btnTactic">작전</button>
    <button class="btn" id="btnPitch">투구</button>
    <button class="btn" id="btnSwing">SWING!</button>

for(const k in MOTD){const b=atob(MOTD[k].b64),a=new Int16Array(b.length/2);for(let i=0;i<a.length;i++){let v=b.charCodeAt(2*i)|b.charCodeAt(2*i+1)<<8;if(v>32767)v-=65536;a[i]=v}MOTD[k].a=a;delete MOTD[k].b64}
const MIRK=k=>{const e=k.slice(-1);return(e==='L'||e==='R')&&k!=='pel'?k.slice(0,-1)+(e==='L'?'R':'L'):k};
function motJ(kind,T,hand){const q=MOTD[kind]||MOTD.over,t=q.t,n=t.length,K=q.keys.length;T=clamp(T,t[0],t[n-1]);let lo=0,hi=n-1;while(hi-lo>1){const m=(lo+hi)>>1;if(t[m]<=T)lo=m;else hi=m}
  const u=(T-t[lo])/((t[hi]-t[lo])||1),o={};for(let j=0;j<K;j++){const a=(lo*K+j)*3,b=(hi*K+j)*3,v=[0,1,2].map(c=>(q.a[a+c]+(q.a[b+c]-q.a[a+c])*u)/1e4);if(hand==='L'){v[0]=-v[0];o[MIRK(q.keys[j])]=v}else o[q.keys[j]]=v}return o}
const lerpPJ=(A,B,u)=>{const o={};for(const k in A)o[k]=[A[k][0]+(B[k][0]-A[k][0])*u,A[k][1]+(B[k][1]-A[k][1])*u,A[k][2]+(B[k][2]-A[k][2])*u];return o};
const PM_L=PM.V.norm([-.4,.85,.55]),PM_C={};
function pmShade(hex,k){const c=PM_C[hex]||(PM_C[hex]=[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)]),m=.74+.3*k;return`rgb(${Math.min(255,c[0]*m)|0},${Math.min(255,c[1]*m)|0},${Math.min(255,c[2]*m)|0})`}
function pmUni(u){return{jersey:u.jersey||'#f4f1ea',trim:u.trim||'#1d3557',pants:u.pants||'#eceae4',sock:u.sock||u.trim||'#1d3557',cap:u.cap||u.trim||'#1d3557',skin:'#e2ae88',shoe:'#1b1b1b',glove:'#8a5a2b',belt:'#1b1b1b'}}
// 모델 좌표(신장=1) → 월드 좌표(m) → 화면. 면을 카메라 깊이로 정렬해 칠함
function drawPM(J,map,opt){const V=PM.V,F=PM.buildPlayer(J,opt),T=[];
  for(const f of F){const q=[];let zs=0,ok=true;for(const p of f.v){const r=pt(map(p));if(!r){ok=false;break}q.push(r);zs+=r.z}if(!ok)continue;
    {let ar=0;for(let i=0;i<q.length;i++){const a=q[i],c=q[(i+1)%q.length];ar+=a.x*c.y-c.x*a.y}if(ar*PM_CULL<0)continue}
    const v=f.v,n=V.norm(V.cross(V.sub(v[1],v[0]),V.sub(v[2],v[0])));T.push({q,z:zs/q.length,col:pmShade(f.c,Math.abs(V.dot(n,PM_L))*.8+.2)})}
  T.sort((a,b)=>b.z-a.z);ctx.lineJoin='round';ctx.lineWidth=.7;
  for(const t of T){ctx.beginPath();t.q.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=t.col;ctx.fill();ctx.strokeStyle=t.col;ctx.stroke()}}
function pmShadow(w,r){const c=pt(w);if(!c)return;ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(c.x,c.y,c.k*r,c.k*r*.3,0,0,7);ctx.fill()}
const PM_S=1.85,WIND=0.9;let PM_CULL=1;
function pitcherPM(wp,u,pit){const kind=['over','side','under'].includes(pit&&pit.arm)?pit.arm:'over',hand=pit&&pit.hand==='L'?'L':'R';let J;
  if(st.mode==='windup'){const x=clamp(1-(st.until-NOW)/WIND,0,1);J=motJ(kind,-WIND+x*WIND,hand)}
  else if(st.fs&&(st.mode==='flight'||st.mode==='post'||st.mode==='inplay')&&NOW-st.fs<1.2){const t=NOW-st.fs;J=t<=.65?motJ(kind,t,hand):lerpPJ(motJ(kind,.65,hand),motJ(kind,-1.3,hand),ease(clamp((t-.65)/.55,0,1)))}
  else J=motJ(kind,-1.3,hand);
  pmShadow([wp[0],wp[1]+.01,wp[2]-.6],.55);
  drawPM(J,p=>[wp[0]+p[0]*PM_S,wp[1]+p[1]*PM_S,wp[2]-p[2]*PM_S],{glove:hand==='R'?'L':'R',U:pmUni(u)})}
function batterPM(b,u){const side=b.curHand==='R'?-1:1,hand=b.curHand==='L'?'L':'R';let J;const st0=motJ('bat',-.8,hand);
  if(st.swingAt>0&&NOW-st.swingAt<1.4){const t=-.15+(NOW-st.swingAt);J=t<=.4?motJ('bat',t,hand):lerpPJ(motJ('bat',.4,hand),st0,ease(clamp((t-.4)/.5,0,1)))}
  else if(st.mode==='windup')J=motJ('bat',-.8+clamp(1-(st.until-NOW)/WIND,0,1)*.5,hand);
  else if(st.mode==='flight'&&st.pitch)J=motJ('bat',-.3+clamp((NOW-st.fs)/st.pitch.D,0,1)*.15,hand);
  else if(st.fs&&st.pitch&&(st.mode==='post'||st.mode==='inplay')&&NOW-st.fs<st.pitch.D+.7){const x=clamp((NOW-st.fs-st.pitch.D)/.6,0,1);J=lerpPJ(motJ('bat',-.15,hand),st0,ease(x))}
  else J=st0;
  const X=p=>side*0.95-(p+side*0.93)*PM_S;   // v4.0: 스탠스를 홈플레이트 쪽으로 0.15(신장 비) 당김
  pmShadow([side*0.95,.01,0.75],.5);
  drawPM(J,p=>[X(p[0]),p[1]*PM_S,0.75+p[2]*PM_S],{batter:true,hand,U:pmUni(u)})}

function fig(wp,u,o){o=o||{};const f=pt(wp);if(!f)return;const tp=pt([wp[0],wp[1]+1.85,wp[2]]);if(!tp)return;
  const h=f.y-tp.y;if(h<4){ctx.fillStyle=u.trim;ctx.fillRect(f.x-1.5,f.y-4,3,4);return}
  if(o.pose==='pitch'&&h>=14){pitcherPM(wp,u,o.pit);return}
  let J=READY,facing=1;
  if(o.pose==='pitch'){const pit=o.pit;facing=pit&&pit.hand==='L'?-1:1;const arm=pit?pit.arm:'over';
    if(st.mode==='windup'){const u=clamp(1-(st.until-NOW-LEAD)/WIND,0,1);J=chainJ(x=>pitchPose(arm,clamp(x,0,1),'wind'),u,1)}
    else if(st.mode==='flight'||(st.mode==='post'&&NOW-st.fs<1.0)||(st.mode==='inplay'&&NOW-st.fs<1.0)){const u=clamp((NOW+LEAD-st.fs)/1.0,0,1);J=chainJ(x=>pitchPose(arm,clamp(x,0,1),'follow'),u,0.5)}
    else J=PB;J=springJ('P',J,1.25,0.7)}
  else if(o.pose==='run'){J=runJ(o.ph!=null?o.ph:NOW*3.2);facing=o.facing||1;if(o.sid)J=springJ(o.sid,J,1.8,0.8)}
  else if(o.J){J=o.J;facing=o.facing||1;if(o.sid)J=springJ(o.sid,J,1.7,0.75)}
  else if(o.pose==='stand'){J=PB}
  drawRig(f.x,f.y,h,J,u,{facing,glow:o.glow})}

function batter(b,u){const side=b.curHand==='R'?-1:1;const wp=[side*0.95,0,0.75];const f=pt(wp),tp=pt([wp[0],1.85,wp[2]]);if(!f||!tp)return;

function leadOf(t){const o=t===G.home?G.away:G.home;return tot(t)-tot(o)}
function enterPitcher(t,p){p.entryLead=leadOf(t);p.blown=false}
function decideGame(){const a=tot(G.away),h=tot(G.home);[G.away,G.home].forEach(t=>{t.pitcher.exitLead=leadOf(t);t.pitchLog.forEach(p=>p.dec='')});
  if(a===h||!G.goAhead)return;
  const W=a>h?G.away:G.home,L=W===G.away?G.home:G.away,ga=G.goAhead;
  let wp=ga.winP;const qual=Math.round(G.innings*5/9)*3;
  if(wp===W.pitchLog[0]&&wp.st.outs<qual&&W.pitchLog.length>1){wp=W.pitchLog.slice(1).reduce((m,p)=>p.st.outs>m.st.outs?p:m)}
  wp.dec='승';if(ga.loseP)ga.loseP.dec=ga.loseP.dec||'패';
  const fin=W.pitchLog[W.pitchLog.length-1];
  if(fin!==wp&&!fin.blown&&fin.entryLead>0&&((fin.entryLead<=3&&fin.st.outs>=3)||fin.st.outs>=9))fin.dec='세';
  [W,L].forEach(t=>t.pitchLog.forEach((p,i)=>{if(i===0||p.dec||p===t.pitchLog[t.pitchLog.length-1])return;
    if(p.entryLead>0&&p.entryLead<=3&&p.st.outs>=1&&p.exitLead>0&&!p.blown)p.dec='홀'}))}

const CAREER_KEY='dny_career_v1';
const loadCareer=()=>LS.get(CAREER_KEY,null)||{games:0,bat:{},pit:{}};
function saveCareer(){if(!G||!G.over||G.saved)return false;const C=loadCareer();C.games++;C.tg=C.tg||{};
  [[G.away,G.home],[G.home,G.away]].forEach(([t,o])=>{const r=C.tg[t.name]=C.tg[t.name]||{G:0,W:0,L:0,D:0,R:0};r.G++;r.R+=tot(t);const a=tot(t),b=tot(o);if(a>b)r.W++;else if(a<b)r.L++;else r.D++});
  G.teams.forEach(t=>{
    const hitters=[...new Set([...t.lineup,...t.used.filter(p=>p.pc==null),...t.bench])].filter(b=>b.appeared||b.st.pa);
    hitters.forEach(b=>{const r=C.bat[b.name]=C.bat[b.name]||{team:'',G:0,PA:0,AB:0,H:0,RBI:0,HR:0,D2:0,D3:0,BB:0,HBP:0,SF:0,SH:0,K:0};
      r.team=t.name;r.G++;r.PA+=b.st.pa;r.AB+=b.st.ab;r.H+=b.st.h;r.RBI+=b.st.rbi;r.HR+=b.st.hr;r.D2+=b.st.d2;r.D3+=b.st.d3;r.BB+=b.st.bb;r.HBP+=b.st.hbp;r.SF+=b.st.sf;r.SH+=b.st.sh;r.K+=b.st.k});
    t.pitchLog.forEach(p=>{const r=C.pit[p.name]=C.pit[p.name]||{team:'',G:0,OUT:0,H:0,HR:0,K:0,BB:0,R:0,ER:0,W:0,L:0,HLD:0,SV:0,NP:0};
      r.team=t.name;r.G++;r.OUT+=p.st.outs;r.H+=p.st.h;r.HR+=p.st.hr;r.K+=p.st.k;r.BB+=p.st.bb;r.R+=p.st.r;r.ER+=p.st.er;r.NP+=p.pc;
      if(p.dec==='승')r.W++;if(p.dec==='패')r.L++;if(p.dec==='홀')r.HLD++;if(p.dec==='세')r.SV++})});
  setCareer(C);G.saved=true;return true}
const f3=v=>isFinite(v)?v.toFixed(3).replace(/^0/,''):'-';
function batLine(s){// s: {PA,AB,H,RBI,HR,D2,D3,BB,HBP,SF}
  const tb=s.H+s.D2+2*s.D3+3*s.HR,avg=s.AB?s.H/s.AB:NaN,obpD=s.AB+s.BB+s.HBP+s.SF,obp=obpD?(s.H+s.BB+s.HBP)/obpD:NaN,slg=s.AB?tb/s.AB:NaN;
  return[s.PA,s.AB,s.H,s.RBI,s.HR,s.D2,s.D3,s.BB+s.HBP,f3(avg),f3(obp),f3(slg),isFinite(obp)&&isFinite(slg)?f3(obp+slg):'-']}
const BAT_TH='<th class="l">타자</th><th>타석</th><th>타수</th><th>안타</th><th>타점</th><th>홈런</th><th>2루타</th><th>3루타</th><th>사<br>사구</th><th>타율</th><th>출루율</th><th>장타율</th><th>OPS</th>';
function gameBat(b){const s=b.st;return{PA:s.pa,AB:s.ab,H:s.h,RBI:s.rbi,HR:s.hr,D2:s.d2,D3:s.d3,BB:s.bb,HBP:s.hbp,SF:s.sf}}
function batTable(t){const list=[...t.lineup.map((b,i)=>({b,o:i+1})),...t.used.filter(p=>p.pc==null).map(b=>({b,o:'교'})),...t.bench.filter(b=>b.st.pa).map(b=>({b,o:'-'}))].filter(x=>x.b.st.pa||x.b.appeared);
  const sum={PA:0,AB:0,H:0,RBI:0,HR:0,D2:0,D3:0,BB:0,HBP:0,SF:0};list.forEach(({b})=>{const g=gameBat(b);for(const k in sum)sum[k]+=g[k]});
  return`<div style="overflow-x:auto"><table class="pt"><tr>${BAT_TH}</tr>${list.map(({b,o})=>`<tr><td class="l">${o} ${b.special?'★':''}${esc(b.name)}</td>${batLine(gameBat(b)).map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}
   <tr class="now"><td class="l">합계</td>${batLine(sum).map(v=>`<td>${v}</td>`).join('')}</tr></table></div>`}
/* ===== 투수 구종·구속 편집 (덮어쓰기 저장) ===== */
let ARS_OVR=LS.get('dny_ars',{})||{};
const saveOvr=()=>{LS.set('dny_ars',ARS_OVR);cloudPush('ars',ARS_OVR)};
function applyOvr(o){if(!o)return o;if(!o._base)o._base={arsenal:o.arsenal,arm:o.arm,veloAvg:o.veloAvg,velo:o.velo};
  const v=ARS_OVR[o.name];
  if(v&&v.ars&&v.ars.length){o.arsenal=v.ars.map(x=>({n:x.n,v:+x.v,u:x.u!=null&&x.u!==''?+x.u:null}));o.arm=v.arm||o._base.arm||'over';o.veloAvg=true;o.velo=Math.max(...v.ars.map(x=>+x.v))}
  else Object.assign(o,o._base);
  return o}
function baseArs(d){const sp=matchSpecial(d.name,'P');
  if(d.arsenal&&d.arsenal.length&&!sp)return{arm:d.arm||'over',ars:d.arsenal.map(x=>({n:x.n,v:x.v,u:x.u??null}))};
  if(sp&&sp.ars&&sp.ars.length)return{arm:sp.arm||'over',ars:sp.ars.map(x=>({n:x.n,v:+x.v,u:x.u??null}))};
  return{arm:(sp&&sp.arm)||d.arm||'over',ars:[{n:'포심',v:+((sp||d).velo)||145}]}}

/* ===== 기록 링크(압축+base64url) ===== */
const REC_BASE=(/^https?:$/.test(location.protocol)&&!/claude|localhost|127\.0\.0\.1/.test(location.hostname))?location.origin+location.pathname:'https://claude.ai/artifact/4C9RojgQTjxeijB9vQ4MF8';
const b64u=u8=>{let s='';for(let i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const ub64=t=>{t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const s=atob(t),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u};
async function pipeBytes(u8,stream){return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(stream)).arrayBuffer())}
async function encRec(d){const raw=new TextEncoder().encode(JSON.stringify(d));
  try{return 'z'+b64u(await pipeBytes(raw,new CompressionStream('deflate-raw')))}catch(e){return 'j'+b64u(raw)}}
async function decRec(txt){txt=(txt||'').trim();if(!txt)return null;
  try{const m=txt.match(/rec=([A-Za-z0-9_-]+)/);let d;
    if(m){const c=m[1],u=ub64(c.slice(1));d=JSON.parse(new TextDecoder().decode(c[0]==='z'?await pipeBytes(u,new DecompressionStream('deflate-raw')):u))}
    else d=JSON.parse(txt);
    return d&&d.bat&&d.pit?d:null}catch(e){return null}}
async function copyText(t){try{await navigator.clipboard.writeText(t);return true}catch(e){}
  try{const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();const ok=document.execCommand('copy');a.remove();return ok}catch(e){return false}}
async function recFromHash(){if(!/rec=/.test(location.hash))return;const d=await decRec(location.hash);try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  if(!d)return;const cur=loadCareer();
  modal(`<h3>기록 불러오기</h3><p class="note">링크에 담긴 기록(저장 경기 ${d.games}개)을 불러올까요?<br>이 기기의 현재 기록(${cur.games}개)은 덮어써져요.</p>

const CLOUD={ok:false,ref:{},busy:{},pend:{}};
function setCareer(C){LS.set(CAREER_KEY,C);cloudPush('career',C)}
async function cloudPush(k,data){if(!CLOUD.ok||!CLOUD.ref[k])return;if(CLOUD.busy[k]){CLOUD.pend[k]=data;return}
  CLOUD.busy[k]=true;try{await CLOUD.ref[k].set({json:JSON.stringify(data),at:Date.now()})}catch(e){try{await new Promise(r=>setTimeout(r,800+Math.random()*800));await CLOUD.ref[k].set({json:JSON.stringify(data),at:Date.now()})}catch(e2){}}
  CLOUD.busy[k]=false;if(CLOUD.pend[k]){const d=CLOUD.pend[k];CLOUD.pend[k]=null;cloudPush(k,d)}}
async function cloudInit(){try{if(!window.claude||!claude.use)return;
  const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);if(!db||!user)return;
  const id=await user.id();if(!id)return;
  CLOUD.ref.career=db.doc('data/users/'+id+'/career');CLOUD.ref.ars=db.doc('data/users/'+id+'/ars');CLOUD.ref.hand=db.doc('data/users/'+id+'/hand');CLOUD.ref.trait=db.doc('data/users/'+id+'/trait');
  const [c,a]=await Promise.all([CLOUD.ref.career.get(),CLOUD.ref.ars.get()]);CLOUD.ok=true;
  const loc=loadCareer();let cd=null;try{cd=c.exists?JSON.parse(c.data().json):null}catch(e){}
  if(cd&&cd.bat&&(cd.games||0)>=(loc.games||0))LS.set(CAREER_KEY,cd);else if(loc.games)cloudPush('career',loc);
  let ad=null;try{ad=a.exists?JSON.parse(a.data().json):null}catch(e){}
  if(ad){for(const k in ARS_OVR)delete ARS_OVR[k];Object.assign(ARS_OVR,ad);LS.set('dny_ars',ARS_OVR)}else if(Object.keys(ARS_OVR).length)cloudPush('ars',ARS_OVR);
  if(G)[G.away,G.home].forEach(t=>[t.pitcher,...t.bullpen,...(t.pitchLog||[])].forEach(p=>p&&applyOvr(p)));
  try{const h=await CLOUD.ref.hand.get();let hd=null;try{hd=h.exists?JSON.parse(h.data().json):null}catch(e){}
    if(hd){for(const k in HAND_OVR)delete HAND_OVR[k];Object.assign(HAND_OVR,hd);LS.set('dny_hand',HAND_OVR)}else if(Object.keys(HAND_OVR).length)cloudPush('hand',HAND_OVR)}catch(e){}
  try{const h=await CLOUD.ref.trait.get();let td=null;try{td=h.exists?JSON.parse(h.data().json):null}catch(e){}
    if(td){TR_OVR=td;LS.set('dny_trait',TR_OVR)}else if(Object.keys(TR_OVR).length)cloudPush('trait',TR_OVR)}catch(e){}
}catch(e){}}

const LIVE_KEY='dny_live_v1';
function graphEnc(root){const ids=new Map();let n=0;
  const enc=v=>{if(v===null||typeof v!=='object')return typeof v==='function'||typeof v==='undefined'?null:v;
    if(ids.has(v))return{$r:ids.get(v)};const id=n++;ids.set(v,id);
    if(Array.isArray(v))return{$i:id,$a:v.map(enc)};const o={};for(const k in v){const x=v[k];if(typeof x==='function'||x instanceof Node)continue;o[k]=enc(x)}return{$i:id,$o:o}};
  return enc(root)}
function graphDec(root){const tab={};
  const dec=v=>{if(v===null||typeof v!=='object')return v;if('$r' in v)return tab[v.$r];
    if('$a' in v){const a=[];tab[v.$i]=a;v.$a.forEach(x=>a.push(dec(x)));return a}
    const o={};tab[v.$i]=o;for(const k in v.$o)o[k]=dec(v.$o[k]);return o};
  return dec(root)}

function hexIcon(t,size,on){const e=TRAIT_ENGINE[t],sym=HEX_SYM[e?e.sym:'_']||HEX_SYM._,id='hg'+(e?e.sym:'x')+(on?'on':'')+size;

    <polygon points="50,3 95,28.5 95,81.5 50,107 5,81.5 5,28.5" fill="#0d0d0f" stroke="url(#${id})" stroke-width="6" stroke-linejoin="round"/>
    <polygon points="50,13 86,33.5 86,76.5 50,97 14,76.5 14,33.5" fill="none" stroke="rgba(226,189,92,.45)" stroke-width="1.6"/>${sym.replace(/GOLDFILL/g,`url(#${id})`)}</svg>`;
  return `<svg class="hexi${on?' on':''}" width="${size}" height="${Math.round(size*1.1)}" viewBox="0 0 100 110" aria-label="${esc(t)}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#fff2b0"/><stop offset=".45" stop-color="#e2bd5c"/><stop offset="1" stop-color="#9c7425"/></linearGradient></defs>

// 목록용: 대표 특성 1개 + 개수
const T_IDX={};
const tIcons=o=>{const ts=traitsOf(o);if(!ts.length)return'';const i=(T_IDX[o.name]||0)%ts.length;return`<span class="hexs" data-tn="${esc(o.name)}" title="${esc(ts[i]+': '+TDESC(ts[i]))}">${hexIcon(ts[i],18)}${ts.length>1?`<small class="hexn">${i+1}/${ts.length}</small>`:''}</span>`};
// 목록의 아이콘을 누르면 다음 특성으로
document.addEventListener('click',e=>{const h=e.target.closest&&e.target.closest('.hexs[data-tn]');if(!h)return;const n=h.dataset.tn,ts=traitsOf(n);if(ts.length<2)return;e.stopPropagation();e.preventDefault();T_IDX[n]=((T_IDX[n]||0)+1)%ts.length;h.outerHTML=tIcons({name:n})},true);
// 선수 카드: 특성 1개씩, 선수 이름을 누르면 다음 특성으로
const tHexes=o=>{const ts=traitsOf(o);if(!ts.length)return'';const i=(T_IDX[o.name]||0)%ts.length,t=ts[i];
  return`<div class="hexes"><div class="hexw" title="${esc(t)}: ${esc(TDESC(t))}">${hexIcon(t,40,tOn(o,t)&&!TRAIT_ENGINE[t].always)}<span>${esc(t)}${isCustomT(o.name,t)?'<i style="color:#9fe0ff;font-style:normal">*</i>':''}${ts.length>1?` ${i+1}/${ts.length} ▸`:''}</span></div></div>`};
function traitRulesHTML(){return TRAIT_DATA.map(t=>`<div style="display:flex;gap:8px;align-items:center;margin:4px 0"><span style="flex:none">${hexIcon(t.name,30)}</span><div><b>${esc(t.name)}</b> — ${esc(t.desc)}${TRAIT_ENGINE[t.name]?'':' <small style="color:#ff9a7a">(효과 준비 중)</small>'}<br><small style="color:#8fc3c9">${esc(t.holders.join(', '))}</small></div></div>`).join('')}

function stealFrom(){const B=G.bases;
  if(B[0]&&!B[1]&&(hasTrait(B[0].b,'대도')||prOK(B[0].b))&&R()<0.25)return 1;
  if(B[1]&&!B[2]&&prOK(B[1].b)&&R()<0.2)return 2;return 0}
function stealRes(){const p=st.pitch;if(!p||!p.steal||p.stealDone||p.hbp)return false;p.stealDone=true;const B=G.bases,pit=fieldTeam().pitcher;
  if(p.steal===2){const r=B[1];if(!r||B[2])return false;
    if(R()<0.78){G.bases=[B[0],null,r];r.b.st.sb=(r.b.st.sb||0)+1;log(`${r.b.name}: 3루 도루 성공 👟`);st.wpNote=(st.wpNote?st.wpNote+' · ':'')+'👟 3루 도루 성공';updateHUD();return false}
    G.bases=[B[0],null,B[2]];G.outs++;pit.st.outs++;r.b.st.cs=(r.b.st.cs||0)+1;log(`${r.b.name}: 3루 도루 실패(도루사)`);
    if(G.outs>=3){markPitch('S','도루사');finishPitch('도루사!','out',false,'이닝 종료');return true}
    st.wpNote=(st.wpNote?st.wpNote+' · ':'')+'도루사';updateHUD();return false}
  const r=B[0];if(!r||B[1])return false;
  if(R()<Math.min(0.97,0.82+(prOK(r.b)?0.2:0))){G.bases=[null,r,B[2]];r.b.st.sb=(r.b.st.sb||0)+1;log(`${r.b.name}: 2루 도루 성공 👟`);st.wpNote=(st.wpNote?st.wpNote+' · ':'')+'👟 도루 성공';updateHUD();return false}
  G.bases=[null,B[1],B[2]];G.outs++;pit.st.outs++;r.b.st.cs=(r.b.st.cs||0)+1;log(`${r.b.name}: 2루 도루 실패(도루사)`);
  if(G.outs>=3){markPitch(G.strikes<2?'S':'S','도루사');finishPitch('도루사!','out',false,'이닝 종료');return true}
  st.wpNote=(st.wpNote?st.wpNote+' · ':'')+'도루사';updateHUD();return false}

function resolveBunt(){st.swung=true;st.buntAt=NOW;{const t=batTeam();t.tk=(t.tk??0.55)*0.9}const r=R();
  if(st.buntNext==='squeeze'){
    if(r<0.22){st.buntNext=false;markPitch('S','번트 파울');if(G.strikes>=2)return strikeout(false,'스리번트 삼진!');G.strikes++;st.ballAnim='foul';st.foulT0=NOW;st.foulDir=R()<.5?-1:1;return finishPitch('번트 파울','foul',false,'3루 주자 귀루')}
    if(r<0.30){st.buntNext=false;markPitch('S','번트 헛스윙');const B=G.bases,pit=fieldTeam().pitcher;B[2]=null;G.outs++;pit.st.outs++;log(`${curBatter().name}: 스퀴즈 실패 — 3루 주자 협살 아웃`);
      if(G.outs>=3)return finishPitch('스퀴즈 실패!','out',false,'3루 주자 협살');
      if(G.strikes>=2)return strikeout(false,'번트 헛스윙 삼진!');G.strikes++;return finishPitch('스퀴즈 실패!','out',false,'3루 주자 협살 아웃')}
    const kind=r<0.88?'sq':r<0.95?'sqhome':'sqsafe';const th=(R()*2-1)*28,dist=7+R()*4;
    return startHit({type:'gb',th,dist,res:'OUT',how:'BUNT',bk:kind,fielder:pick(['P','C','1B','3B']),great:false,T:0.9,h:0.3,land:P(dist,th)})}
  if(r<0.39+0.55&&r>=0.55){// 번트 파울 (39%)
    st.buntNext=false;
    if(G.strikes>=2){markPitch('S','번트 파울');return strikeout(false,'스리번트 삼진!')}
    markPitch('S','번트 파울');G.strikes++;st.ballAnim='foul';st.foulT0=NOW;st.foulDir=R()<.5?-1:1;return finishPitch('번트 파울','foul',false,'')}
  const kind=r<0.55?'ok':r<0.97?'dp':'lead';const th=(R()*2-1)*28,dist=7+R()*4;
  startHit({type:'gb',th,dist,res:'OUT',how:'BUNT',bk:kind,fielder:pick(['P','C','1B','3B']),great:false,T:0.9,h:0.3,land:P(dist,th)})}
function applyBunt(h){const b=curBatter(),pit=fieldTeam().pitcher,B=G.bases,me={b,p:pit};b.st.pa++;let txt;
  if(h.bk==='sq'||h.bk==='sqsafe'||h.bk==='sqhome'){let sc=[];
    if(h.bk==='sqhome'){b.st.ab++;G.outs++;pit.st.outs++;B[2]=null;if(B[1]){B[2]=B[1];B[1]=null}if(B[0]){B[1]=B[0];B[0]=null}B[0]=me;txt='홈 승부 아웃 — 타자 1루 세이프'}
    else{sc.push(B[2]);B[2]=null;if(B[1]){B[2]=B[1];B[1]=null}if(B[0]){B[1]=B[0];B[0]=null}
      if(h.bk==='sq'){b.st.sh++;G.outs++;pit.st.outs++;txt='스퀴즈 성공!'}else{b.st.ab++;B[0]=me;txt='스퀴즈 — 올 세이프!'}}
    if(sc.length)score(sc,b,true);
    st.buntNext=false;log(`${b.name}: ${txt}${sc.length?' +1점':''}`);return finishPitch(txt,h.bk==='sqhome'?'out':'hit',true,sc.length?'+1점':'')}
  if(h.bk==='ok'){b.st.sh++;G.outs++;pit.st.outs++;if(B[1]){B[2]=B[1];B[1]=null}if(B[0]){B[1]=B[0];B[0]=null}txt='희생번트 성공!'}
  else if(h.bk==='dp'){b.st.ab++;G.outs+=2;pit.st.outs+=2;if(B[1]){B[1]=null;if(B[0]){B[1]=B[0];B[0]=null}}else B[0]=null;txt='번트 병살!'}
  else{b.st.ab++;G.outs++;pit.st.outs++;if(B[1]){B[1]=null;if(B[0])B[1]=B[0];B[0]=me}else B[0]=me;txt='선행주자 아웃'}
  st.buntNext=false;log(`${b.name}: ${txt}`);finishPitch(txt,h.bk==='ok'?'hit':'out',true,'')}

   <div class="row"><button class="btn sm gray" id="cl">닫기</button></div>`,el=>{

   el.querySelector('#tR').onclick=()=>{const rs=[0,1,2].filter(i=>G.bases[i]);

   el.querySelector('#tD').onclick=()=>modal(`<h3>대수비 — ${esc(ft.name)}</h3><p class="note">빠질 선수를 고르세요. 들어오는 선수가 그 포지션을 맡아요.</p><div class="list">${ft.lineup.map((q,i)=>`<div class="it click" data-i="${i}"><span>${esc(posK(q.pos))} · ${esc(q.name)} ${tIcons(q)}</span><span class="r">${i+1}번</span></div>`).join('')}</div><div class="row"><button class="btn sm gray" id="cl">취소</button></div>`,e2=>{

       e2.querySelectorAll('select').forEach(sel=>sel.onchange=()=>{const q=ft.lineup[+sel.dataset.i],np=sel.value,o=ft.lineup.find(x=>x!==q&&x.pos===np);if(o)o.pos=q.pos;log(`수비 위치: ${q.name} ${POSK[q.pos]}→${POSK[np]}${o?` / ${o.name} ${POSK[np]}→${POSK[o.pos]}`:''}`);q.pos=np;draw()})});draw()};
   el.querySelector('#tS').onclick=()=>{if(!canSqueeze())return;st.buntNext='squeeze';closeModal();log(`${curBatter().name}: 스퀴즈 번트 작전`);showBanner('스퀴즈 작전','strike','투구 버튼을 누르세요')};
   el.querySelector('#tB').onclick=()=>{if(!canBunt())return;st.buntNext=true;closeModal();log(`${curBatter().name}: 희생번트 작전`);showBanner('희생번트 작전','strike','투구 버튼을 누르세요')};
   el.querySelector('#tP').onclick=()=>modal(`<h3>투수 교체 — ${esc(ft.name)}</h3><div class="list">${ft.bullpen.map((q,j)=>`<div class="it click" data-j="${j}"><span>${q.special?'<span class=star>★</span>':''}${esc(q.name)} <small>${q.hand==='L'?'좌':'우'}</small></span><span class="r">${q.arsenal?q.arsenal.map(a=>a.n).join('/'):q.velo+'km'}${q.era!=null?` · ERA ${q.era}`:''}<br>${q.role==='SP'?'선발':'구원'} · 제${q.control} 위${q.stuff}</span></div>`).join('')}</div><div class="row"><button class="btn sm gray" id="cl">취소</button></div>`,e2=>{

   el.querySelector('#tH').onclick=()=>modal(`<h3>대타 — ${esc(bt.name)}</h3><p class="note">${bt.idx+1}번 ${esc(curBatter().name)} 대신</p><div class="list">${bt.bench.map((q,j)=>`<div class="it click" data-j="${j}"><span>${q.special?'<span class=star>★</span>':''}${esc(q.name)} <small>${esc(posK(q.pos))}</small> ${tIcons(q)}</span><span class="r">컨${q.contact} 파${q.power}${q.hand?' · '+(q.hand==='L'?'좌':'우')+'타':''}</span></div>`).join('')}</div><div class="row"><button class="btn sm gray" id="cl">취소</button></div>`,e2=>{

function rulesModal(){modal(`<h3>규칙</h3><div class="note" style="font-size:14px;line-height:1.6">
 <b>진행</b> — [투구] 버튼(키보드 Enter)을 눌러야 공을 던져요.<br><b>타격</b> — 공이 노란 스트라이크 존에 들어올 때 SWING!(Space) 너무 빠르거나 늦으면 헛스윙, 살짝 어긋나면 파울. 파울로는 삼진이 안 돼요. 존 밖 공은 치기 어려워요.<br>
 <b>투구폼</b> — 사이드암은 낮고 옆에서 나와 횡변화가 크고, 언더핸드는 무릎 높이에서 떠오르듯 들어와요.<br><b>투구</b> — 투수별 구종(CSV)이 있으면 그 구종 중에서, 없으면 체크된 구종 중 무작위. 몸쪽으로 크게 빠진 공에 맞으면 <b>몸에 맞는 공</b>(1루 진루, 사사구 기록). 투수의 구속·제구·구위·체력이 반영되고, 투구수가 늘면 체력이 떨어져 제구와 구위가 나빠져요.<br>
 <b>특성</b> — 선수 카드 오른쪽 육각형 아이콘. 특성이 2개 이상이면 선수 이름을 누를 때마다 바뀌어요. 효과가 켜지면 아이콘이 빛나요.${traitRulesHTML()} <b>타구 판정</b> — 펜스 색 구간 판정은 없어요. 타이밍·파워·투수 구위로 <b>타구 속도</b>와 <b>발사각</b>이 정해지고, 방향과 함께 비거리·체공 시간을 계산해요. 펜스(좌우 95m·중앙 110m)를 넘기면 홈런, 야수가 체공 시간 안에 도달하면 아웃, 못 잡으면 공을 잡아 던지는 시간과 타자 주루 시간을 비교해 1·2·3루타가 결정돼요. 땅볼도 내야수가 따라잡는지·송구가 빠른지로 아웃/내야안타를 판정해요.<br>
 <b>투구 위치</b> — 타석마다 들어온 공의 위치가 존 위에 번호로 표시돼요(노랑=스트라이크·헛스윙·파울, 초록=볼, 파랑=타격).<br><b>수비</b> — 넓은 수비 범위(전체 수비 성공률 +4%p 상향). 외야수는 10%(중견수는 15%) 확률로 호수비(한 단계 감소).<br>
 <b>병살·태그업</b> — 1루 주자 + 2아웃 미만 땅볼은 75% 병살. 3루 주자 + 2아웃 미만 외야 플라이는 90% 득점.<br>
 <b>스퀴즈</b> — [작전]에서 선택(3루 주자, 2아웃 전). 성공 58%(득점·타자 아웃·다른 주자 진루), 번트 파울 22%, 헛스윙 8%(3루 주자 협살), 홈 승부 아웃 7%, 올 세이프 5%.<br><b>희생번트</b> — [작전]에서 선택(주자 1루·2루·1,2루, 3루 비었을 때). 다음 투구에 번트: 성공 55%(주자 한 베이스씩 진루), 번트 파울 39%(2스트라이크면 스리번트 삼진), 병살 3%, 선행주자 아웃 3%.<br><b>기록 저장</b> — 경기가 끝난 뒤 [기록 저장]을 누르면 타자·투수 기록이 누적돼요(이 브라우저에 저장). 상단 [기록실]에서 확인.<br><b>교체</b> — 투구 사이 [작전] 버튼으로 수비팀은 투수 교체, 공격팀은 대타 기용. 교체된 선수는 재출전 불가.<br>
 <b>등록 선수</b> — 경기 전 팀마다 1명까지 직접 골라 합류시켜요. <b>구장</b> — 경기 전 10개 구장 중 선택, 구장마다 펜스 거리·높이가 달라요(그린 몬스터·몬스터월은 낮은 타구를 막아 펜스 직격).<br>
 <b>경기</b> — 3아웃마다 공수 교대(폰 넘기기). 마지막 이닝 초 종료 시 홈팀 리드면 종료, 마지막 이닝 말 끝내기 득점 시 즉시 종료, 동점이면 무승부.</div>
 <div class="row"><button class="btn sm" id="cl">닫기</button></div>`,el=>el.querySelector('#cl').onclick=closeModal)}

/* ================= 이벤트 ================= */
document.querySelector('nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;const m=b.dataset.m;
  if(m==='pitches')pitchModal();else if(m==='ars')arsModal(0);else if(m==='line0')lineupModal(0);else if(m==='line1')lineupModal(1);else if(m==='log')logModal();else if(m==='career')careerModal('bat');else if(m==='rules')rulesModal()};
$('#btnSwing').addEventListener('pointerdown',e=>{e.preventDefault();doSwing()});
$('#stage').addEventListener('pointerdown',e=>{e.preventDefault();doSwing()});
$('#btnTactic').onclick=tacticModal;
$('#btnPitch').addEventListener('pointerdown',e=>{e.preventDefault();doPitch()});
window.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;if(e.code==='Space'){e.preventDefault();doSwing()}else if(e.code==='Enter'||e.code==='KeyP'){e.preventDefault();doPitch()}});
window.addEventListener('resize',resize);try{new ResizeObserver(()=>{const r=cv.getBoundingClientRect();if(Math.abs(r.width-W)>0.5||Math.abs(r.height-H)>0.5)resize()}).observe(cv)}catch(e){}
['#cardP','#cardB'].forEach(id=>$(id).addEventListener('click',e=>{if(G&&e.target.closest('.nm,.hexes')){const o=id==='#cardP'?fieldTeam().pitcher:curBatter(),n=traitsOf(o).length;if(n>1){T_IDX[o.name]=((T_IDX[o.name]||0)+1)%n;updateHUD();return}}st.cardRt=!st.cardRt;updateHUD()}));cv=$('#cv');ctx=cv.getContext('2d');bg=document.createElement('canvas');bgctx=bg.getContext('2d');
resize();updateHUD();loadDefaultDB().finally(()=>{updateHUD();showSetup();recFromHash();
  const L=liveInfo();if(L){const g=L.g,a=g.away,h=g.home;
    modal(`<h3>진행 중이던 경기</h3><p class="note" style="font-size:16px">${esc(a.name)} <b>${tot(a)}</b> : <b>${tot(h)}</b> ${esc(h.name)}<br>${g.inning}회${g.half?'말':'초'} ${g.outs}아웃</p>
      <p class="note">페이지가 다시 열려도 경기는 타석마다 자동 저장돼요.</p>
      <div class="row"><button class="btn gold" id="lv1">이어하기</button><button class="btn gray" id="lv0">새 경기</button></div>`,el=>{
      el.querySelector('#lv1').onclick=()=>{closeModal();resumeLive()};
      el.querySelector('#lv0').onclick=()=>{try{localStorage.removeItem(LIVE_KEY)}catch(e){};closeModal()}})}});cloudInit();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{bgKey=''});
requestAnimationFrame(frame);
</script>
